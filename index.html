<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Batalla de Equipos 2026 · Zona Pádel Club</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;700&display=swap');
:root{
  --verde:#007E76; --verde-hondo:#00655E; --lima:#D7DE69;
  --tinta:#053B37; --claro:#9ED8D1; --glass:#DCEAE7;
  --gris:#5C7B77; --linea:#CBDDD9; --alerta:#D9482F;
}
*{box-sizing:border-box}
body{margin:0;background:var(--verde);color:var(--tinta);font-family:'Poppins',system-ui,sans-serif;font-size:15px;line-height:1.45}
input,button,select,textarea{font-family:inherit;font-size:15px}
.mono{font-family:'IBM Plex Mono',monospace}

/* cabecera */
.top{background:var(--verde);padding:18px 16px 14px;display:flex;align-items:flex-start;gap:12px}
.marca{width:min(230px,58vw);height:auto;margin:-4px 0 0 -4px}
.menu-btn{margin-left:auto;background:transparent;border:0;color:#fff;cursor:pointer;padding:6px;line-height:0}
.menu-btn svg{width:30px;height:30px}
.titulo{padding:0 16px 14px}
.titulo h1{font-weight:800;font-size:clamp(22px,6vw,34px);line-height:.95;letter-spacing:-.035em;margin:0;color:#fff}
.titulo h1 em{font-style:normal;color:var(--lima)}
.titulo .quien{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--claro);margin-top:8px;font-family:'IBM Plex Mono',monospace}

/* cajón lateral */
.velo{position:fixed;inset:0;background:rgba(5,59,55,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:8}
.velo.abierto{opacity:1;pointer-events:auto}
.cajon{position:fixed;top:0;right:0;bottom:0;width:min(300px,84vw);overflow-y:auto;background:var(--verde-hondo);transform:translateX(100%);transition:transform .22s;z-index:9;padding:18px 0 30px}
.cajon.abierto{transform:translateX(0)}
.cajon h2{color:var(--claro);font-size:11px;letter-spacing:.18em;text-transform:uppercase;margin:18px 20px 8px;font-family:'IBM Plex Mono',monospace;font-weight:500}
.cajon a{display:block;padding:13px 20px;color:#fff;text-decoration:none;font-weight:600;cursor:pointer;border-left:4px solid transparent}
.cajon a:hover{background:rgba(255,255,255,.07)}
.cajon a.activo{border-left-color:var(--lima);color:var(--lima)}
.cerrar{position:absolute;top:14px;right:14px;background:transparent;border:0;color:#fff;font-size:24px;cursor:pointer;line-height:1}

/* contenido */
.wrap{max-width:900px;margin:0 auto;padding:4px 14px 60px}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px}
.card.borde{border-left:4px solid var(--lima)}
h2.sec{color:#fff;font-weight:700;text-transform:uppercase;font-size:14px;letter-spacing:.05em;margin:20px 0 9px}
h2.sec:first-child{margin-top:6px}
h3{margin:0 0 8px;font-size:16px;font-weight:700}
.nota{font-size:12.5px;color:var(--claro);margin:2px 0 16px;max-width:62ch}
.vacio{background:rgba(255,255,255,.1);border-radius:12px;padding:22px;color:#fff;font-size:14px;text-align:center}

.fila{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
label.lab{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--gris);font-weight:600;display:block;margin-bottom:3px}
input[type=text],input[type=email],input[type=password],input[type=number],select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--linea);border-radius:8px;background:#fff}
textarea{min-height:80px;resize:vertical}
.btn{padding:10px 15px;border:0;border-radius:8px;background:var(--tinta);color:#fff;font-weight:600;cursor:pointer}
.btn:hover{background:var(--verde-hondo)}
.btn.claro{background:#fff;color:var(--tinta);border:1px solid var(--linea)}
.btn.lima{background:var(--lima);color:var(--tinta)}
.btn:disabled{opacity:.5;cursor:default}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:7px 13px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;font-size:13px;cursor:pointer}
.chip.on{background:var(--lima);color:var(--tinta);border-color:var(--lima);font-weight:600}

.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.eqcard{background:#fff;border-radius:12px;padding:14px;text-align:center;cursor:pointer;border:0}
.eqcard img{width:56px;height:56px;object-fit:contain;margin-bottom:6px}
.eqcard .nom{font-weight:700;font-size:14px}
.eqcard .pts{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--gris)}

table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;margin-bottom:8px}
th{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--gris);padding:8px 5px;text-align:right;border-bottom:1px solid var(--linea);white-space:nowrap}
th:nth-child(2){text-align:left}
td{padding:8px 5px;border-bottom:1px solid var(--glass);text-align:right;font-family:'IBM Plex Mono',monospace;font-size:13px;white-space:nowrap}
td:nth-child(2){text-align:left;font-family:'Poppins',sans-serif;font-weight:600}
tr:last-child td{border-bottom:0}
.pos{color:var(--gris);font-size:11px}
.pts{font-weight:700;background:rgba(215,222,105,.34)}
@media(max-width:600px){th:nth-child(6),td:nth-child(6),th:nth-child(8),td:nth-child(8){display:none}th,td{padding:8px 4px;font-size:12.5px}}

.cat{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;background:var(--tinta);color:var(--lima);padding:3px 7px;border-radius:4px}
.avisito{padding:9px 12px;border-radius:8px;font-size:13px;margin-bottom:10px}
.avisito.mal{background:rgba(217,72,47,.1);color:var(--alerta)}
.avisito.bien{background:rgba(215,222,105,.35);color:var(--tinta)}
.cargando{color:#fff;text-align:center;padding:40px 0;font-size:14px}
.dupla{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--glass)}
.dupla:last-child{border-bottom:0}
.dupla img{width:52px;height:52px;border-radius:8px;object-fit:cover;background:var(--glass)}
.dupla .n{font-weight:600;font-size:14px}
.dupla .c{font-size:12px;color:var(--gris)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const URL_SB = 'https://efuivscdjjpxltytpgxf.supabase.co';
const LLAVE  = 'sb_publishable_HzIf3QRYjGYwWFYjkEJ--g_B8-Tg-_y';
const sb = createClient(URL_SB, LLAVE);

const D = { categorias:[], equipos:[], jugadoras:[], duplas:[], jornadas:[], partidos:[], tabla:[], ranking:[], noticias:[] };
let vista = 'resultados';
let sesion = null;            // administradora conectada
let yo = null;                // jugadora conectada
let filtroFecha = 'todas';
let equipoAbierto = null;

const $  = s => document.querySelector(s);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cat = id => D.categorias.find(c => c.id === id)?.codigo ?? '';
const eq  = id => D.equipos.find(e => e.id === id)?.nombre ?? '';
const signo = n => (n > 0 ? '+' : '') + n;
const fechaLarga = f => new Date(f + 'T12:00:00')
  .toLocaleDateString('es-CL', { weekday:'long', day:'numeric', month:'long' });

/* ---------- datos ---------- */
async function cargar(){
  const t = async (n, o) => (await sb.from(n).select('*').order(o ?? 'id')).data ?? [];
  [D.categorias, D.equipos, D.jugadoras, D.duplas, D.jornadas] = await Promise.all([
    t('categorias','orden'), t('equipos','orden'), t('jugadoras','nombre'), t('duplas'), t('jornadas','numero')
  ]);
  [D.partidos, D.tabla, D.ranking, D.noticias] = await Promise.all([
    t('partidos'), t('v_tabla_equipos'), t('v_ranking_duplas'),
    (await sb.from('noticias').select('*').order('publicada_en',{ascending:false})).data ?? []
  ]);
}

/* ---------- sesión ---------- */
async function revisarSesion(){
  const { data } = await sb.auth.getSession();
  sesion = data.session ?? null;
  if(sesion){
    const { data:p } = await sb.from('perfiles').select('*').eq('id', sesion.user.id).maybeSingle();
    if(!p) sesion = null;
  }
  const g = localStorage.getItem('batalla:jugadora');
  if(g && !sesion){ try{ yo = JSON.parse(g); }catch(e){ yo = null; } }
  pintarMenu();
}

function pintarMenu(){
  $('#lnk-perfil').hidden = !yo;
  $('#lnk-admin').hidden  = !sesion;
  $('#lnk-salir').hidden  = !(yo || sesion);
  $('#lnk-entrar').hidden = !!(yo || sesion);
  $('#quien').textContent = sesion ? 'Administradora · ' + sesion.user.email
                          : yo     ? 'Jugadora · ' + yo.nombre
                          : 'Público';
}

/* ---------- navegación ---------- */
const cajon = (abrir) => {
  $('#cajon').classList.toggle('abierto', abrir);
  $('#velo').classList.toggle('abierto', abrir);
};
$('#abrir').onclick  = () => cajon(true);
$('#cerrar').onclick = () => cajon(false);
$('#velo').onclick   = () => cajon(false);

document.querySelectorAll('.cajon a[data-vista]').forEach(a => {
  a.onclick = () => {
    vista = a.dataset.vista; equipoAbierto = null;
    document.querySelectorAll('.cajon a').forEach(o => o.classList.remove('activo'));
    a.classList.add('activo');
    cajon(false); pintar();
  };
});
$('#lnk-salir').onclick = async () => {
  await sb.auth.signOut();
  localStorage.removeItem('batalla:jugadora');
  sesion = null; yo = null; vista = 'resultados';
  pintarMenu(); cajon(false); pintar();
};

/* ============================================================
   PANTALLAS
   ============================================================ */
function pintar(){
  const p = $('#pantalla');
  p.className = '';
  const f = { resultados:vResultados, equipos:vEquipos, perfil:vPerfil,
              noticias:vNoticias, entrar:vEntrar, admin:vAdmin }[vista] ?? vResultados;
  p.innerHTML = f();
  enlazar();
}

/* --- resultados --- */
let subRes = 'partidos';
function vResultados(){
  const chips = ['partidos','equipos','duplas'].map(s =>
    `<button class="chip ${subRes===s?'on':''}" data-sub="${s}">${
      {partidos:'Partidos',equipos:'Tabla de equipos',duplas:'Ranking de duplas'}[s]}</button>`).join('');
  let cuerpo = '';
  if(subRes === 'partidos'){
    const fechas = ['todas', ...D.jornadas.map(j => j.id)];
    cuerpo = `<div class="chips">${fechas.map(f =>
      `<button class="chip ${String(filtroFecha)===String(f)?'on':''}" data-fecha="${f}">${
        f==='todas' ? 'Todas' : esc(D.jornadas.find(j=>j.id===f).nombre)}</button>`).join('')}</div>`;
    const lista = D.partidos.filter(p => filtroFecha==='todas' || p.jornada_id===filtroFecha);
    cuerpo += lista.length ? lista.map(tarjetaPartido).join('')
      : `<div class="vacio">Todavía no hay partidos programados. Las administradoras los cargan en la sección de administración.</div>`;
  }
  if(subRes === 'equipos') cuerpo = D.tabla.length ? tablaPos(D.tabla,'Equipo') : sinDatos();
  if(subRes === 'duplas'){
    cuerpo = D.ranking.length ? D.categorias.map(c => {
      const l = D.ranking.filter(r => r.categoria === c.codigo);
      return l.length ? `<h2 class="sec">Categoría ${esc(c.codigo)}</h2>` + tablaPos(l,'Dupla') : '';
    }).join('') : sinDatos();
  }
  return `<h2 class="sec">Resultados</h2><div class="chips">${chips}</div>${cuerpo}`;
}
const sinDatos = () => `<div class="vacio">Aún no hay partidos jugados. La tabla aparece sola en cuanto se cargue el primer resultado.</div>`;

function tarjetaPartido(p){
  const j = D.jornadas.find(x => x.id === p.jornada_id);
  const marcador = p.estado === 'jugado'
    ? `<span class="mono">${p.set1_a}-${p.set1_b} · ${p.set2_a}-${p.set2_b}${p.stb_a!=null?` · ${p.stb_a}-${p.stb_b}`:''}</span>`
    : `<span class="mono" style="color:var(--gris)">${p.hora ? p.hora.slice(0,5) : 'por jugar'}${p.cancha?' · cancha '+esc(p.cancha):''}</span>`;
  return `<div class="card"><div class="fila" style="margin:0">
      <span class="cat">${esc(cat(p.categoria_id))}</span>
      <span style="font-size:12px;color:var(--gris)">${j?esc(j.nombre):''}</span>
      <span style="margin-left:auto">${marcador}</span></div>
    <div style="margin-top:8px;font-weight:600">${esc(eq(p.equipo_a))} <span style="color:var(--gris);font-weight:400">vs</span> ${esc(eq(p.equipo_b))}</div>
  </div>`;
}

function tablaPos(lista, etiqueta){
  return `<table><thead><tr><th>#</th><th>${etiqueta}</th><th>PJ</th><th>G</th><th>P</th>
    <th>Sets</th><th>±S</th><th>Games</th><th>±G</th><th>Pts</th></tr></thead><tbody>` +
    lista.map((f,i) => `<tr><td class="pos">${i+1}</td>
      <td>${esc(f.nombre ?? f.equipo)}</td><td>${f.pj}</td><td>${f.pg}</td><td>${f.pp}</td>
      <td>${f.sets_g ?? '—'}${f.sets_g!=null?'-'+f.sets_p:''}</td><td>${signo(f.dif_sets)}</td>
      <td>${f.games_g ?? '—'}${f.games_g!=null?'-'+f.games_p:''}</td><td>${signo(f.dif_games)}</td>
      <td class="pts">${f.puntos}</td></tr>`).join('') + `</tbody></table>`;
}

/* --- equipos --- */
function vEquipos(){
  if(equipoAbierto) return detalleEquipo(equipoAbierto);
  if(!D.equipos.length) return `<h2 class="sec">Equipos</h2><div class="vacio">Todavía no hay equipos cargados.</div>`;
  return `<h2 class="sec">Equipos</h2><div class="rejilla">` + D.equipos.map(e => {
    const t = D.tabla.find(x => x.equipo_id === e.id);
    return `<button class="eqcard" data-equipo="${e.id}">
      ${e.logo_url ? `<img src="${esc(e.logo_url)}" alt="">` : ''}
      <div class="nom">${esc(e.nombre)}</div>
      <div class="pts">${t ? t.puntos + ' pts' : '—'}</div></button>`;
  }).join('') + `</div>`;
}

function detalleEquipo(id){
  const e = D.equipos.find(x => x.id === id);
  const ds = D.duplas.filter(d => d.equipo_id === id);
  const ps = D.partidos.filter(p => p.equipo_a === id || p.equipo_b === id);
  return `<h2 class="sec">${esc(e.nombre)}</h2>
    <button class="btn claro" id="volver" style="margin-bottom:12px">← Todos los equipos</button>
    ${e.descripcion ? `<div class="card">${esc(e.descripcion)}</div>` : ''}
    <div class="card"><h3>Duplas</h3>${ds.length ? ds.map(d => {
      const js = [d.jugadora_1, d.jugadora_2].map(i => D.jugadoras.find(j => j.id === i)?.nombre).filter(Boolean);
      return `<div class="dupla">
        <img src="${d.foto_url ? esc(d.foto_url) : ''}" alt="">
        <div><div class="n">${js.length ? esc(js.join(' y ')) : 'Por definir'}</div>
        <div class="c">Categoría ${esc(cat(d.categoria_id))}</div></div></div>`;
    }).join('') : '<p class="c">Todavía no hay duplas cargadas.</p>'}</div>
    <h2 class="sec">Partidos</h2>
    ${ps.length ? ps.map(tarjetaPartido).join('') : `<div class="vacio">Sin partidos programados.</div>`}`;
}

/* --- perfil de la jugadora --- */
function vPerfil(){
  if(!yo) return `<h2 class="sec">Perfil personal</h2><div class="vacio">Entra con tu nombre y tu código para ver tus partidos.</div>`;
  const d = D.duplas.find(x => x.id === yo.dupla_id);
  const comp = d ? [d.jugadora_1, d.jugadora_2].filter(i => i !== yo.jugadora_id)
    .map(i => D.jugadoras.find(j => j.id === i)?.nombre).filter(Boolean)[0] : null;
  const mios = d ? D.partidos.filter(p => p.dupla_a === d.id || p.dupla_b === d.id) : [];
  const porJugar = mios.filter(p => p.estado !== 'jugado');
  const jugados  = mios.filter(p => p.estado === 'jugado');
  return `<h2 class="sec">Hola, ${esc(yo.nombre)}</h2>
    <div class="card"><div class="dupla" style="border:0">
      <img src="${d?.foto_url ? esc(d.foto_url) : ''}" alt="">
      <div><div class="n">${comp ? 'Con ' + esc(comp) : 'Dupla por definir'}</div>
      <div class="c">${esc(eq(yo.equipo_id))}${d ? ' · Categoría ' + esc(cat(d.categoria_id)) : ''}</div></div>
    </div></div>
    <h2 class="sec">Tus próximos partidos</h2>
    ${porJugar.length ? porJugar.map(tarjetaPartido).join('') : `<div class="vacio">No tienes partidos programados por ahora.</div>`}
    <h2 class="sec">Partidos jugados</h2>
    ${jugados.length ? jugados.map(tarjetaPartido).join('') : `<div class="vacio">Todavía no juegas ninguno.</div>`}`;
}

/* --- noticias --- */
function vNoticias(){
  const pub = D.noticias.filter(n => n.publicada || sesion);
  if(!pub.length) return `<h2 class="sec">Noticias</h2><div class="vacio">Todavía no hay noticias publicadas.</div>`;
  return `<h2 class="sec">Noticias destacadas</h2>` + pub.map(n => `
    <div class="card ${n.destacada?'borde':''}">
      ${n.portada_url ? `<img src="${esc(n.portada_url)}" alt="" style="width:100%;border-radius:8px;margin-bottom:10px">` : ''}
      <h3>${esc(n.titulo)}</h3>
      ${n.bajada ? `<p style="color:var(--gris);margin:0 0 8px">${esc(n.bajada)}</p>` : ''}
      <div style="white-space:pre-wrap">${esc(n.cuerpo)}</div>
      ${!n.publicada ? `<div class="avisito mal" style="margin-top:10px">Borrador, no visible para el público</div>` : ''}
    </div>`).join('');
}

/* --- entrar --- */
function vEntrar(){
  const ops = D.jugadoras.length
    ? D.jugadoras.map(j => `<option value="${j.id}">${esc(j.nombre)} · ${esc(eq(j.equipo_id))}</option>`).join('')
    : '<option value="">(aún no hay jugadoras cargadas)</option>';
  return `<h2 class="sec">Entrar</h2>
    <div class="card"><h3>Soy jugadora</h3>
      <div id="msg-j"></div>
      <div style="margin-bottom:10px"><label class="lab">Tu nombre</label><select id="j-id">${ops}</select></div>
      <div style="margin-bottom:12px"><label class="lab">Tu código de 4 dígitos</label>
        <input type="text" id="j-cod" inputmode="numeric" maxlength="4" placeholder="····"></div>
      <button class="btn lima" id="j-entrar">Entrar</button>
      <p style="font-size:12.5px;color:var(--gris);margin:10px 0 0">Tu capitana te entrega el código. Queda guardado en este teléfono.</p>
    </div>
    <div class="card"><h3>Soy administradora</h3>
      <div id="msg-a"></div>
      <div style="margin-bottom:10px"><label class="lab">Correo</label><input type="email" id="a-mail"></div>
      <div style="margin-bottom:12px"><label class="lab">Contraseña</label><input type="password" id="a-pass"></div>
      <button class="btn" id="a-entrar">Entrar</button>
    </div>`;
}

/* --- administración --- */
let subAdm = 'equipos';
function vAdmin(){
  if(!sesion) return `<h2 class="sec">Administración</h2><div class="vacio">Necesitas entrar como administradora.</div>`;
  const chips = ['equipos','plantel','noticias'].map(s =>
    `<button class="chip ${subAdm===s?'on':''}" data-adm="${s}">${
      {equipos:'Equipos',plantel:'Jugadoras y duplas',noticias:'Noticias'}[s]}</button>`).join('');
  return `<h2 class="sec">Administración</h2><div class="chips">${chips}</div>` +
    ({ equipos:admEquipos, plantel:admPlantel, noticias:admNoticias }[subAdm])();
}

function admEquipos(){
  return `<p class="nota">Cambia el nombre, el color y el logo de cada equipo. El logo se sube al depósito de fotos.</p>` +
    D.equipos.map(e => `<div class="card" data-eqedit="${e.id}">
      <div class="fila">
        ${e.logo_url ? `<img src="${esc(e.logo_url)}" style="width:44px;height:44px;object-fit:contain">` : ''}
        <div style="flex:1;min-width:150px"><label class="lab">Nombre</label>
          <input type="text" class="e-nom" value="${esc(e.nombre)}"></div>
        <div style="width:90px"><label class="lab">Color</label>
          <input type="text" class="e-col" value="${esc(e.color ?? '')}" placeholder="#D7DE69"></div>
      </div>
      <div style="margin-bottom:8px"><label class="lab">Descripción</label>
        <textarea class="e-desc">${esc(e.descripcion ?? '')}</textarea></div>
      <div style="margin-bottom:10px"><label class="lab">Grito</label>
        <input type="text" class="e-grito" value="${esc(e.grito ?? '')}"></div>
      <div class="fila"><input type="file" class="e-logo" accept="image/*">
        <button class="btn e-guardar">Guardar</button></div>
      <div class="e-msg"></div>
    </div>`).join('');
}

function admPlantel(){
  const sel = D.equipos.map(e => `<option value="${e.id}" ${equipoAbierto===e.id?'selected':''}>${esc(e.nombre)}</option>`).join('');
  const id = equipoAbierto ?? D.equipos[0]?.id;
  if(!id) return `<div class="vacio">Primero tienen que existir los equipos.</div>`;
  const filas = D.categorias.map(c => {
    const d = D.duplas.find(x => x.equipo_id === id && x.categoria_id === c.id);
    const j = [0,1].map(k => D.jugadoras.find(x => x.id === (k ? d?.jugadora_2 : d?.jugadora_1)));
    return `<div class="card" data-dupla="${c.id}">
      <div class="fila" style="margin-bottom:12px"><span class="cat">${esc(c.codigo)}</span>
        ${d?.foto_url ? `<img src="${esc(d.foto_url)}" style="width:44px;height:44px;border-radius:8px;object-fit:cover">` : ''}</div>
      ${[0,1].map(k => `<div class="fila">
        <div style="flex:1;min-width:130px"><label class="lab">Jugadora ${k+1}</label>
          <input type="text" class="p-nom" data-k="${k}" value="${esc(j[k]?.nombre ?? '')}"></div>
        <div style="width:96px"><label class="lab">Código</label>
          <input type="text" class="p-cod" data-k="${k}" maxlength="4" inputmode="numeric" placeholder="auto"></div>
      </div>`).join('')}
      <div style="margin:6px 0 10px"><label class="lab">Descripción de la dupla</label>
        <textarea class="d-desc">${esc(d?.descripcion ?? '')}</textarea></div>
      <div class="fila"><input type="file" class="d-foto" accept="image/*">
        <button class="btn d-guardar">Guardar dupla</button></div>
      <div class="d-msg"></div>
    </div>`;
  }).join('');
  return `<div style="margin-bottom:12px"><label class="lab" style="color:#fff">Equipo</label>
      <select id="adm-eq">${sel}</select></div>
    <p class="nota">Si dejas el código en blanco, se genera uno automático y te lo muestro al guardar. Anótalo: después solo lo ves acá.</p>${filas}`;
}

function admNoticias(){
  return `<div class="card"><h3>Nueva noticia</h3>
      <div style="margin-bottom:8px"><label class="lab">Título</label><input type="text" id="n-tit"></div>
      <div style="margin-bottom:8px"><label class="lab">Bajada</label><input type="text" id="n-baj"></div>
      <div style="margin-bottom:8px"><label class="lab">Texto</label><textarea id="n-cue"></textarea></div>
      <div class="fila"><input type="file" id="n-foto" accept="image/*">
        <label style="font-size:13px"><input type="checkbox" id="n-pub"> Publicar de inmediato</label>
        <label style="font-size:13px"><input type="checkbox" id="n-des"> Destacada</label></div>
      <button class="btn lima" id="n-guardar">Guardar noticia</button><div id="n-msg"></div>
    </div>
    ${D.noticias.map(n => `<div class="card"><div class="fila" style="margin:0">
        <strong style="flex:1">${esc(n.titulo)}</strong>
        <button class="btn claro n-toggle" data-id="${n.id}" data-pub="${n.publicada}">${n.publicada?'Despublicar':'Publicar'}</button>
      </div></div>`).join('')}`;
}

/* ============================================================
   ACCIONES
   ============================================================ */
async function subirFoto(file, carpeta){
  const ext = file.name.split('.').pop().toLowerCase();
  const ruta = `${carpeta}/${Date.now()}.${ext}`;
  const { error } = await sb.storage.from('fotos').upload(ruta, file, { upsert:true });
  if(error) throw error;
  return sb.storage.from('fotos').getPublicUrl(ruta).data.publicUrl;
}
const aviso = (el, txt, mal) => { el.innerHTML = `<div class="avisito ${mal?'mal':'bien'}">${esc(txt)}</div>`; };
const codigoAzar = () => String(Math.floor(1000 + Math.random()*9000));

function enlazar(){
  document.querySelectorAll('[data-sub]').forEach(b => b.onclick = () => { subRes = b.dataset.sub; pintar(); });
  document.querySelectorAll('[data-fecha]').forEach(b => b.onclick = () => {
    filtroFecha = b.dataset.fecha === 'todas' ? 'todas' : +b.dataset.fecha; pintar(); });
  document.querySelectorAll('[data-equipo]').forEach(b => b.onclick = () => { equipoAbierto = +b.dataset.equipo; pintar(); });
  document.querySelectorAll('[data-adm]').forEach(b => b.onclick = () => { subAdm = b.dataset.adm; pintar(); });
  if($('#volver')) $('#volver').onclick = () => { equipoAbierto = null; pintar(); };
  if($('#adm-eq')) $('#adm-eq').onchange = e => { equipoAbierto = +e.target.value; pintar(); };

  if($('#j-entrar')) $('#j-entrar').onclick = async () => {
    const id = +$('#j-id').value, cod = $('#j-cod').value.trim();
    const { data, error } = await sb.rpc('entrar_jugadora', { p_jugadora_id:id, p_codigo:cod });
    if(error || !data?.length) return aviso($('#msg-j'), 'Ese código no corresponde. Pregúntale a tu capitana.', true);
    yo = data[0]; localStorage.setItem('batalla:jugadora', JSON.stringify(yo));
    pintarMenu(); vista = 'perfil'; pintar();
  };

  if($('#a-entrar')) $('#a-entrar').onclick = async () => {
    const { error } = await sb.auth.signInWithPassword({ email:$('#a-mail').value.trim(), password:$('#a-pass').value });
    if(error) return aviso($('#msg-a'), 'Correo o contraseña incorrectos.', true);
    await revisarSesion();
    if(!sesion) return aviso($('#msg-a'), 'Esa cuenta existe pero no está registrada como administradora.', true);
    vista = 'admin'; pintar();
  };

  document.querySelectorAll('.e-guardar').forEach(b => b.onclick = async () => {
    const c = b.closest('[data-eqedit]'), id = +c.dataset.eqedit, msg = c.querySelector('.e-msg');
    try{
      const cambios = {
        nombre: c.querySelector('.e-nom').value.trim(),
        color:  c.querySelector('.e-col').value.trim() || null,
        descripcion: c.querySelector('.e-desc').value.trim() || null,
        grito:  c.querySelector('.e-grito').value.trim() || null
      };
      const f = c.querySelector('.e-logo').files[0];
      if(f) cambios.logo_url = await subirFoto(f, 'logos');
      const { error } = await sb.from('equipos').update(cambios).eq('id', id);
      if(error) throw error;
      await cargar(); aviso(msg, 'Guardado.'); setTimeout(pintar, 700);
    }catch(e){ aviso(msg, 'No se pudo guardar: ' + e.message, true); }
  });

  document.querySelectorAll('.d-guardar').forEach(b => b.onclick = async () => {
    const c = b.closest('[data-dupla]'), catId = +c.dataset.dupla, msg = c.querySelector('.d-msg');
    const eqId = +($('#adm-eq')?.value ?? equipoAbierto);
    try{
      const ids = [];
      const codigos = [];
      for(const k of [0,1]){
        const nom = c.querySelector(`.p-nom[data-k="${k}"]`).value.trim();
        if(!nom){ ids.push(null); continue; }
        const previa = D.duplas.find(x => x.equipo_id===eqId && x.categoria_id===catId);
        const idPrev = k ? previa?.jugadora_2 : previa?.jugadora_1;
        let jid = idPrev;
        if(jid){
          await sb.from('jugadoras').update({ nombre:nom }).eq('id', jid);
        }else{
          const { data, error } = await sb.from('jugadoras')
            .insert({ nombre:nom, equipo_id:eqId, categoria_id:catId }).select().single();
          if(error) throw error; jid = data.id;
        }
        let cod = c.querySelector(`.p-cod[data-k="${k}"]`).value.trim();
        if(!/^\d{4}$/.test(cod)) cod = codigoAzar();
        await sb.from('accesos').upsert({ jugadora_id:jid, codigo:cod });
        codigos.push(`${nom}: ${cod}`);
        ids.push(jid);
      }
      const fila = { equipo_id:eqId, categoria_id:catId, jugadora_1:ids[0], jugadora_2:ids[1],
                     descripcion: c.querySelector('.d-desc').value.trim() || null };
      const f = c.querySelector('.d-foto').files[0];
      if(f) fila.foto_url = await subirFoto(f, 'duplas');
      const { error } = await sb.from('duplas').upsert(fila, { onConflict:'equipo_id,categoria_id' });
      if(error) throw error;
      await cargar();
      aviso(msg, 'Guardado. Códigos → ' + (codigos.join('  ·  ') || 'sin cambios'));
    }catch(e){ aviso(msg, 'No se pudo guardar: ' + e.message, true); }
  });

  if($('#n-guardar')) $('#n-guardar').onclick = async () => {
    try{
      const fila = { titulo:$('#n-tit').value.trim(), bajada:$('#n-baj').value.trim() || null,
        cuerpo:$('#n-cue').value.trim(), publicada:$('#n-pub').checked, destacada:$('#n-des').checked,
        publicada_en: $('#n-pub').checked ? new Date().toISOString() : null, autor: sesion.user.id };
      if(!fila.titulo) return aviso($('#n-msg'), 'Ponle un título.', true);
      const f = $('#n-foto').files[0];
      if(f) fila.portada_url = await subirFoto(f, 'noticias');
      const { error } = await sb.from('noticias').insert(fila);
      if(error) throw error;
      await cargar(); aviso($('#n-msg'), 'Noticia guardada.'); setTimeout(pintar, 700);
    }catch(e){ aviso($('#n-msg'), 'No se pudo guardar: ' + e.message, true); }
  };

  document.querySelectorAll('.n-toggle').forEach(b => b.onclick = async () => {
    const pub = b.dataset.pub !== 'true';
    await sb.from('noticias').update({ publicada:pub, publicada_en: pub ? new Date().toISOString() : null })
      .eq('id', +b.dataset.id);
    await cargar(); pintar();
  });
}

/* ---------- arranque ---------- */
(async function(){
  try{
    await cargar();
    await revisarSesion();
    pintar();
  }catch(e){
    $('#pantalla').className = '';
    $('#pantalla').innerHTML = `<div class="vacio">No se pudo conectar con la base de datos.<br><br>
      <span class="mono" style="font-size:12px">${esc(e.message)}</span></div>`;
  }
})();
</script>
