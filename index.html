/* Se repinta sola mientras escriben: quién gana y cuántos puntos. */
function previaResultado(){
  const caja = $('#r-previa');
  if(!caja) return;
  const p = D.partidos.find(x => x.id === +$('#r-form').dataset.id);
  const m = leerMarcador();
  if(m.set1_a == null && m.set1_b == null && m.set2_a == null && m.set2_b == null)
    return caja.innerHTML = '';
  const c = cuentaPartido(m, p.es_final);
  const r = reparos(m);
  const gana = c.setsA === c.setsB ? null : (c.setsA > c.setsB ? 'a' : 'b');
  caja.innerHTML = `
    ${gana ? `<div class="veredicto">
      <strong>Gana ${esc(nomDupla(gana === 'a' ? p.dupla_a : p.dupla_b))}</strong>
      <span>${c.setsA}-${c.setsB} en sets</span>
      <div class="reparto">
        <span>${esc(eq(ladoA(p)))} <b>${c.puntosA}</b></span>
        <span>${esc(eq(ladoB(p)))} <b>${c.puntosB}</b></span>
      </div></div>`
      : `<div class="avisito mal">Con estos números el partido queda empatado en sets.</div>`}
    ${r.length ? `<div class="avisito mal">${r.map(esc).join('<br>')}</div>` : ''}`;
}

async function armarExcel(){
  /* La librería de Excel pesa bastante y solo la ocupan las
     administradoras, así que se baja recién al apretar el botón. */
  const XLSX = await import('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm');
  const libro = XLSX.utils.book_new();
  const jugados = p => p.estado === 'jugado' && p.set1_a != null;

  /* ---------- hoja 1: la parrilla, fecha por fecha ---------- */
  const canchas = [...new Set(D.partidos.map(p => p.cancha).filter(Boolean))]
    .sort((a,b) => String(a).localeCompare(String(b), 'es', { numeric:true }));
  const ancho = 1 + canchas.length * 4;
  const filas = [];
  const juntar = [];                               // celdas combinadas
  const fila = n => filas.length + n;              // fila actual, base 0

  for(const j of D.jornadas){
    const suyos = D.partidos.filter(p => p.jornada_id === j.id);
    if(!suyos.length) continue;

    juntar.push({ s:{ r:fila(0), c:0 }, e:{ r:fila(0), c:ancho - 1 } });
    filas.push([`${j.nombre.toUpperCase()} · ${fechaLarga(j.fecha).toUpperCase()}`]);

    const cab = ['Hora'];
    canchas.forEach((c, i) => {
      juntar.push({ s:{ r:fila(0), c:1 + i*4 }, e:{ r:fila(0), c:4 + i*4 } });
      cab.push(`CANCHA ${c}`, '', '', '');
    });
    filas.push(cab);
    filas.push(['', ...canchas.flatMap(() => ['Cat.','Dupla A','Dupla B','Resultado'])]);

    const horas = [...new Set(suyos.map(p => p.hora ? p.hora.slice(0,5) : 'Sin hora'))].sort();
    for(const h of horas){
      const linea = [h];
      for(const c of canchas){
        const p = suyos.find(x => (x.hora ? x.hora.slice(0,5) : 'Sin hora') === h && x.cancha === c);
        linea.push(p ? cat(p.categoria_id) : '',
                   p ? nomDupla(p.dupla_a) : '',
                   p ? nomDupla(p.dupla_b) : '',
                   p ? (jugados(p) ? marcadorTexto(p)
                      : p.estado === 'programado' ? '' : p.estado) : '');
      }
      filas.push(linea);
    }
    filas.push([]);
  }

  const hoja = XLSX.utils.aoa_to_sheet(filas);
  hoja['!merges'] = juntar;
  hoja['!cols'] = [{ wch:9 }, ...canchas.flatMap(() => [{ wch:7 },{ wch:21 },{ wch:21 },{ wch:17 }])];
  XLSX.utils.book_append_sheet(libro, hoja, 'Programación');

  /* ---------- hoja 2: un partido por línea ---------- */
  const det = [['Fecha','Día','Hora','Cancha','Categoría',
                'Dupla A','Equipo A','Dupla B','Equipo B',
                'Set 1','Set 2','Súper TB','Ganador','Puntos A','Puntos B','Estado']];
  for(const j of D.jornadas){
    const suyos = D.partidos.filter(p => p.jornada_id === j.id)
      .sort((a,b) => (a.hora||'').localeCompare(b.hora||'')
                  || String(a.cancha||'').localeCompare(String(b.cancha||'')));
    for(const p of suyos){
      const c = jugados(p) ? cuentaPartido(p, p.es_final) : null;
      det.push([
        j.nombre, j.fecha, p.hora ? p.hora.slice(0,5) : '', p.cancha ?? '',
        cat(p.categoria_id),
        nomDupla(p.dupla_a), eq(ladoA(p)), nomDupla(p.dupla_b), eq(ladoB(p)),
        p.set1_a != null ? `${p.set1_a}-${p.set1_b}` : '',
        p.set2_a != null ? `${p.set2_a}-${p.set2_b}` : '',
        p.stb_a  != null ? `${p.stb_a}-${p.stb_b}`   : '',
        c ? nomDupla(c.setsA > c.setsB ? p.dupla_a : p.dupla_b) : '',
        c ? c.puntosA : '', c ? c.puntosB : '',
        p.estado
      ]);
    }
  }
  const hoja2 = XLSX.utils.aoa_to_sheet(det);
  hoja2['!cols'] = [{wch:20},{wch:11},{wch:7},{wch:8},{wch:9},{wch:21},{wch:10},
                    {wch:21},{wch:10},{wch:7},{wch:7},{wch:9},{wch:21},{wch:9},{wch:9},{wch:12}];
  hoja2['!autofilter'] = { ref: XLSX.utils.encode_range({ s:{r:0,c:0}, e:{r:det.length-1, c:15} }) };
  XLSX.utils.book_append_sheet(libro, hoja2, 'Partido por partido');

  /* ---------- hoja 3: la tabla de equipos ---------- */
  const tab = [['#','Equipo','PJ','Ganados','Perdidos','Sets a favor','Sets en contra','±Sets',
                'Games a favor','Games en contra','±Games','Puntos extra','PUNTOS']];
  D.tabla.forEach((t, i) => tab.push([i+1, t.nombre, t.pj, t.pg, t.pp, t.sets_g, t.sets_p, t.dif_sets,
    t.games_g, t.games_p, t.dif_games, t.puntos_extra ?? 0, t.puntos]));
  const hoja3 = XLSX.utils.aoa_to_sheet(tab);
  hoja3['!cols'] = [{wch:4},{wch:12},{wch:5},{wch:9},{wch:10},{wch:13},{wch:14},{wch:7},
                    {wch:14},{wch:15},{wch:8},{wch:13},{wch:8}];
  XLSX.utils.book_append_sheet(libro, hoja3, 'Tabla de equipos');

  /* ---------- hoja 4: el ranking de duplas ---------- */
  const ran = [['Categoría','Dupla','Equipo','PJ','Ganados','Perdidos','±Sets','±Games','Puntos']];
  D.ranking.forEach(r => ran.push([r.categoria, nomDupla(r.dupla_id), r.equipo,
    r.pj, r.pg, r.pp, r.dif_sets, r.dif_games, r.puntos]));
  const hoja4 = XLSX.utils.aoa_to_sheet(ran);
  hoja4['!cols'] = [{wch:10},{wch:24},{wch:12},{wch:5},{wch:9},{wch:10},{wch:8},{wch:9},{wch:8}];
  XLSX.utils.book_append_sheet(libro, hoja4, 'Ranking de duplas');

  const hoy = new Date().toISOString().slice(0,10);
  XLSX.writeFile(libro, `batalla-equipos-2026-${hoy}.xlsx`);
}

/* Achica la foto antes de subirla: las de teléfono pesan 3-5 MB
   y eso hace lenta la app para las jugadoras. Si algo falla, sube la original. */
function achicar(file, maxLado = 1400){
  return new Promise(resolve => {
    if(!file.type.startsWith('image/')) return resolve(file);
    const img = new Image();
    img.onload = () => {
      const escala = Math.min(1, maxLado / Math.max(img.width, img.height));
      if(escala === 1 && file.size < 600000) return resolve(file);
      const c = document.createElement('canvas');
      c.width  = Math.round(img.width  * escala);
      c.height = Math.round(img.height * escala);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => resolve(b || file), 'image/jpeg', 0.84);
      URL.revokeObjectURL(img.src);
    };
    img.onerror = () => resolve(file);
    img.src = URL.createObjectURL(file);
  });
}

async function subirArchivo(file, carpeta){
  const ext = (file.name.split('.').pop() || 'pdf').toLowerCase();
  const ruta = `${carpeta}/${Date.now()}.${ext}`;
  const { error } = await sb.storage.from('fotos')
    .upload(ruta, file, { upsert:true, contentType: file.type || 'application/octet-stream' });
  if(error) throw error;
  return sb.storage.from('fotos').getPublicUrl(ruta).data.publicUrl;
}

async function subirFoto(file, carpeta){
  const chico = await achicar(file);
  const ruta = `${carpeta}/${Date.now()}.jpg`;
  const { error } = await sb.storage.from('fotos')
    .upload(ruta, chico, { upsert:true, contentType:'image/jpeg' });
  if(error) throw error;
  return sb.storage.from('fotos').getPublicUrl(ruta).data.publicUrl;
}

      .update({ respuesta: texto, respondida_en: new Date().toISOString() })
      .eq('id', +b.dataset.id);
    if(error) return problema(msg, error);
    respondiendo = null;
    await cargar(); pintar();

  document.querySelectorAll('.q-borrar').forEach(b => b.onclick = async () => {
    if(!confirm('¿Borrar esta pregunta? No se puede deshacer.')) return;

  if($('#x-guardar')) $('#x-guardar').onclick = async () => {

    if(error) return problema($('#x-msg'), error);
    await cargar(); pintar();
  };

  document.querySelectorAll('.x-borrar').forEach(b => b.onclick = async () => {
    await sb.from('ajustes').delete().eq('id', +b.dataset.id);
    await cargar(); pintar();
  });

  /* --- editor de la programación --- */
  document.querySelectorAll('[data-jadm]').forEach(b => b.onclick = () => {
    jorAdm = +b.dataset.jadm; partidoEdit = null; resultadoEdit = null; pintar();
  });
  document.querySelectorAll('.pa-editar').forEach(b => b.onclick = () => {
    partidoEdit = +b.dataset.id; resultadoEdit = null; pintar();
  });
  document.querySelectorAll('.pa-resultado').forEach(b => b.onclick = () => {
    resultadoEdit = +b.dataset.id; partidoEdit = null; pintar();

  if($('#r-cancelar')) $('#r-cancelar').onclick = () => { resultadoEdit = null; pintar(); };

  if($('#pa-nuevo'))    $('#pa-nuevo').onclick    = () => { partidoEdit = 'nuevo'; pintar(); };

  if($('#au-crear')) $('#au-crear').onclick = async () => {

      const fila = { nombre,
        enlace:  comoEnlace($('#au-url').value),
        mensaje: $('#au-msg').value.trim() || null,
        orden:   (D.auspiciadores.at(-1)?.orden ?? 0) + 1 };
      const f = $('#au-logo').files[0];
      if(f) fila.logo_url = await subirFoto(f, 'auspiciadores');
      const { error } = await sb.from('auspiciadores').insert(fila);
      if(error) throw error;
      await cargarAuspicios(true);
    }catch(e){ problema(msg, e); }
  };
  document.querySelectorAll('.au-subir').forEach(b =>
    b.onclick = () => { auspicioEdit = null; moverAuspicio(+b.dataset.id, -1); });
  document.querySelectorAll('.au-bajar').forEach(b =>
    b.onclick = () => { auspicioEdit = null; moverAuspicio(+b.dataset.id, 1); });
  document.querySelectorAll('.au-editar').forEach(b =>
    b.onclick = () => { auspicioEdit = +b.dataset.id; pintar(); });
  if($('#aue-cancelar')) $('#aue-cancelar').onclick = () => { auspicioEdit = null; pintar(); };
  if($('#aue-guardar'))  $('#aue-guardar').onclick  = async () => {
    const msg = $('#aue-msg');
    try{
      const nombre = $('#aue-nom').value.trim();
      if(!nombre) return aviso(msg, 'El nombre no puede quedar vacío.', true);
      const cambios = {
        nombre,
        enlace:  comoEnlace($('#aue-url').value),
        mensaje: $('#aue-linea').value.trim() || null

      const f = $('#aue-logo').files[0];
      if(f) cambios.logo_url = await subirFoto(f, 'auspiciadores');
      const { error } = await sb.from('auspiciadores')
        .update(cambios).eq('id', +$('#au-form').dataset.id);
      if(error) throw error;
      auspicioEdit = null;
      await cargarAuspicios(true);
    }catch(e){ problema(msg, e); }
  };
  document.querySelectorAll('.au-borrar').forEach(b => b.onclick = async () => {
    if(!confirm(`¿Borrar a ${b.dataset.nom} de los auspiciadores?`)) return;
    await sb.from('auspiciadores').delete().eq('id', +b.dataset.id);

  if($('#pa-cancelar')) $('#pa-cancelar').onclick = () => { partidoEdit = null; pintar(); };

  if($('#pa-borrar'))   $('#pa-borrar').onclick   = borrarPartido;

  /* --- etiquetas de las noticias --- */
  if($('#et-crear')) $('#et-crear').onclick = async () => {
    const nombre = $('#et-nueva').value.trim();
    if(!nombre) return aviso($('#et-msg'), 'Escribe el nombre de la etiqueta.', true);

      const orden = (D.etiquetas.at(-1)?.orden ?? 0) + 1;
      const { error } = await sb.from('etiquetas').insert({ nombre, orden });
      if(error) throw error;
      await cargar(); pintar();
    }catch(e){ problema($('#et-msg'), e); }

  document.querySelectorAll('.et-borrar').forEach(b => b.onclick = async () => {
    const usada = D.noticias.filter(n => n.etiqueta === b.dataset.nom).length;
    if(usada && !confirm(`${usada} noticia${usada===1?'':'s'} usa${usada===1?'':'n'} esta etiqueta. `
      + 'Se van a quedar con la etiqueta escrita, pero ya no vas a poder elegirla. ¿Borrarla igual?')) return;
    try{
      const { error } = await sb.from('etiquetas').delete().eq('id', +b.dataset.id);
      if(error) throw error;
      await cargar(); pintar();
    }catch(e){ problema($('#et-msg'), e); }
  });

  if($('#n-cancelar')) $('#n-cancelar').onclick = () => { editandoNoticia = null; pintar(); };

  if($('#n-guardar')) $('#n-guardar').onclick = async () => {
    try{
      const pub = $('#n-pub').checked;
      const fila = { titulo:$('#n-tit').value.trim(), bajada:$('#n-baj').value.trim() || null,
        cuerpo:$('#n-cue').value.trim(), etiqueta:$('#n-etq').value,
        publicada:pub, destacada:$('#n-des').checked };
      if(!fila.titulo) return aviso($('#n-msg'), 'Ponle un título.', true);
      const f = $('#n-foto').files[0];
      if(f) fila.portada_url = await subirFoto(f, 'noticias');

      if(editandoNoticia){
        const previa = D.noticias.find(x => x.id === editandoNoticia);
        if(pub && !previa.publicada) fila.publicada_en = new Date().toISOString();
        const { error } = await sb.from('noticias').update(fila).eq('id', editandoNoticia);
        if(error) throw error;
      } else {
        fila.autor = sesion.user.id;
        fila.publicada_en = pub ? new Date().toISOString() : null;
        const { error } = await sb.from('noticias').insert(fila);
        if(error) throw error;
      }
      /* solo una noticia puede ir en portada */
      if(fila.destacada) await sb.from('noticias').update({ destacada:false })
        .neq('id', editandoNoticia ?? 0).eq('destacada', true);

      editandoNoticia = null;
      await cargar(); pintar();
    }catch(e){ problema($('#n-msg'), e); }
  };

  document.querySelectorAll('.n-editar').forEach(b => b.onclick = () => {
    editandoNoticia = +b.dataset.id; pintar(); window.scrollTo({top:0, behavior:'smooth'});
  });

  document.querySelectorAll('.n-borrar').forEach(b => b.onclick = async () => {
    const n = D.noticias.find(x => x.id === +b.dataset.id);
    if(!confirm(`¿Borrar "${n.titulo}"? No se puede deshacer.`)) return;
    await sb.from('noticias').delete().eq('id', n.id);
    if(editandoNoticia === n.id) editandoNoticia = null;
    await cargar(); pintar();
  });

  document.querySelectorAll('.n-toggle').forEach(b => b.onclick = async () => {
    const pub = b.dataset.pub !== 'true';
    await sb.from('noticias').update({ publicada:pub, publicada_en: pub ? new Date().toISOString() : null })
      .eq('id', +b.dataset.id);
    await cargar(); pintar();
  });
}

/* ============================================================
   MANTENERSE AL DÍA
   La app queda abierta en el teléfono durante días. Sin esto,
   una jugadora seguiría viendo la programación o las noticias
   del momento en que la abrió por última vez.
   ============================================================ */

let refrescando = false;
let ultimoRefresco = Date.now();

/* Vuelve a pedir todo y repinta, cuidando de no interrumpir algo
   que la administradora esté escribiendo. */
async function refrescar(aLaFuerza){
  if(refrescando || document.hidden) return;
  /* Si hay un formulario abierto, esperamos: repintar le borraría
     lo que lleva escrito. */
  if(partidoEdit || resultadoEdit || auspicioEdit || editandoNoticia || respondiendo) return;
  const activo = document.activeElement;
  if(activo && ['INPUT','TEXTAREA','SELECT'].includes(activo.tagName)) return;

  refrescando = true;
  try{
    const antes = huella();
    await cargar();
    ultimoRefresco = Date.now();
    /* Solo repintamos si de verdad cambió algo: así no se mueve la
       pantalla bajo el dedo de alguien que está leyendo. */
    if(aLaFuerza || huella() !== antes){
      const y = window.scrollY;
      pintar();
      window.scrollTo(0, y);
    }
  }catch(e){ /* sin señal: se reintenta en el próximo turno */ }
  refrescando = false;
}

/* Un resumen corto de lo que se ve en pantalla, para saber si hubo
   cambios sin comparar todo dato por dato. */
function huella(){
  const p = D.partidos.map(x => `${x.id}.${x.jornada_id}.${x.hora}.${x.cancha}.${x.estado}.${x.set1_a}-${x.set1_b}.${x.set2_a}-${x.set2_b}.${x.stb_a}`).join('|');
  const n = D.noticias.map(x => `${x.id}.${x.publicada}.${x.destacada}.${x.titulo}.${x.portada_url}`).join('|');
  const q = D.preguntas.map(x => `${x.id}.${x.respuesta ? 1 : 0}`).join('|');
  const e = D.equipos.map(x => `${x.id}.${x.nombre}.${x.logo_url}.${x.foto_url}.${x.capitana}.${x.grito}`).join('|');
  const d = D.duplas.map(x => `${x.id}.${x.jugadora_1}.${x.jugadora_2}.${x.foto_url}`).join('|');
  const t = D.tabla.map(x => `${x.equipo_id}.${x.puntos}`).join('|');
  const v = D.diva ? `${D.diva.nombre}.${D.diva.foto_url}.${D.diva.logo_url}.${D.diva.reglamento_url}.${D.diva.descripcion}` : '';
  return [p, n, q, e, d, t, v].join('#');
}

/* Tres momentos: al volver a la app, al tocar la pantalla después
   de un rato, y cada dos minutos mientras esté a la vista. */
function mantenerAlDia(){
  document.addEventListener('visibilitychange', () => { if(!document.hidden) refrescar(); });
  window.addEventListener('focus', refrescar);
  window.addEventListener('online', refrescar);
  setInterval(refrescar, 120000);

  tironParaActualizar();
}

/* Tirar hacia abajo estando arriba del todo. Se dibuja una pastilla
   que baja con el dedo, para que se note que la app entendió. */
function tironParaActualizar(){
  const señal = document.createElement('div');
  señal.className = 'tiron';
  señal.textContent = 'Tira para actualizar';
  document.body.appendChild(señal);

  const UMBRAL = 70;
  let parte = null, distancia = 0;

  const mostrar = d => {
    señal.style.transform = `translate(-50%, ${Math.min(d, 110)}px)`;
    señal.style.opacity = d > 12 ? '1' : '0';
    señal.textContent = d >= UMBRAL ? 'Suelta para actualizar' : 'Tira para actualizar';
    señal.classList.toggle('listo', d >= UMBRAL);
  };
  const esconder = () => {
    señal.style.transform = 'translate(-50%, -60px)';
    señal.style.opacity = '0';
    señal.classList.remove('listo');
  };

  window.addEventListener('touchstart', e => {
    parte = window.scrollY <= 0 ? e.touches[0].clientY : null;
    distancia = 0;
  }, { passive:true });

  window.addEventListener('touchmove', e => {
    if(parte === null) return;
    distancia = e.touches[0].clientY - parte;
    if(distancia > 0 && window.scrollY <= 0) mostrar(distancia * 0.5);
    else { esconder(); parte = null; }
  }, { passive:true });

  window.addEventListener('touchend', async () => {
    if(parte === null) return;
    const llego = distancia * 0.5 >= UMBRAL;
    parte = null; distancia = 0;
    if(!llego) return esconder();

    señal.textContent = 'Actualizando…';
    señal.style.transform = 'translate(-50%, 70px)';
    await refrescar(true);
    señal.textContent = 'Al día';
    setTimeout(esconder, 700);
  }, { passive:true });

  esconder();
}

  }
})();
