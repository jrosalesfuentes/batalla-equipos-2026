<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Batalla de Equipos 2026 · Zona Pádel Club</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#007E76">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Batalla">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://efuivscdjjpxltytpgxf.supabase.co" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
:root{
  --verde:#007E76; --verde-hondo:#00655E; --lima:#D7DE69;
  --tinta:#053B37; --claro:#9ED8D1; --glass:#DCEAE7;
  --gris:#5C7B77; --linea:#CBDDD9; --alerta:#D9482F;
}
*{box-sizing:border-box}
/* Que nada empuje la página hacia los lados en un teléfono: lo que
   no quepa se desplaza dentro de su propia caja, no moviendo todo. */
html,body{max-width:100%;overflow-x:hidden}
img{max-width:100%}
body{margin:0;background:var(--verde);color:var(--tinta);font-family:'Poppins',system-ui,sans-serif;font-size:15px;line-height:1.45}
input,button,select,textarea{font-family:inherit;font-size:15px;color:inherit}
/* Sin esto, iPhone pinta el texto de todo botón de su azul de sistema,
   y al tocar deja un recuadro azul de selección. */
button{color:inherit;-webkit-appearance:none;appearance:none}
html{-webkit-tap-highlight-color:transparent}
/* En el teléfono, tocar algo no lo tiñe ni lo apaga: abre y listo.
   Los efectos de "mouse encima" quedan solo para el computador, que
   si no iOS los deja pegados después de tocar. */
.eqfila,.nombre,.dupla.tocable,.reglamento,.auspicio,.chip,.btn,.celda,.cajon a{
  transition:none}
.eqfila:active,.eqfila:focus,.nombre:active,.nombre:focus,
.dupla.tocable:active,.reglamento:active,.auspicio:active{
  opacity:1;filter:none;background:#fff}
.chip:active,.btn:active,.cajon a:active{opacity:1;filter:none}
body,button,a,.chip,.eqfila,.nombre,.dupla,.celda,.auspicio,.marcha,.cajon,.barra,.cab{
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
/* Lo que sí se puede copiar: los textos de verdad. */
p,.texto,.desc-equipo,.desc-dupla,.cuerpo-noticia,td,th,input,textarea,select{
  -webkit-user-select:text;user-select:text}
::selection{background:var(--lima);color:var(--tinta)}
::-moz-selection{background:var(--lima);color:var(--tinta)}
.mono{font-family:'IBM Plex Mono',monospace}

/* cabecera */
.top{background:var(--verde);padding:10px 14px 12px;display:flex;align-items:center;gap:10px}
.top .sub{flex:1;text-align:center}
.marca{width:min(230px,58vw);height:auto;margin:-4px 0 0 -4px}
.menu-btn{background:transparent;border:0;color:#fff;cursor:pointer;padding:6px;line-height:0}
.menu-btn svg{width:30px;height:30px}
.titulo{display:none}
.logo-batalla{display:block;width:88px;height:auto;flex:none;order:3}
.titulo h1{font-weight:800;font-size:clamp(22px,6vw,34px);line-height:.95;letter-spacing:-.035em;margin:0;color:#fff}
.titulo h1 em{font-style:normal;color:var(--lima)}
.sub{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#fff;font-weight:700;line-height:1.35}
.quien{color:var(--claro);font-size:12px;padding:2px 20px 8px;font-family:'IBM Plex Mono',monospace}

/* cajón lateral */
.navbar.oculta,.menu-btn.oculta,.top.oculta{display:none}
.navbar{position:sticky;top:0;z-index:6;background:var(--verde-hondo);display:flex;
  box-shadow:0 2px 10px rgba(0,0,0,.13)}
.navbar button{flex:1;min-width:0;background:transparent;border:0;color:var(--glass);cursor:pointer;
  padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-family:inherit;font-size:8.5px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;
  border-bottom:3px solid transparent}
.navbar button.on{color:var(--lima);border-bottom-color:var(--lima)}
.navbar svg{width:19px;height:19px;flex:none}
.insta{display:flex;align-items:center;gap:9px;margin:26px 20px 0;padding-top:16px;
  border-top:1px solid rgba(255,255,255,.16);color:var(--claro);text-decoration:none;font-size:13px}
@media (hover:hover){ .insta:hover{color:var(--lima)} }
.insta svg{width:19px;height:19px;flex:none}
.velo{position:fixed;inset:0;background:rgba(5,59,55,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:8}
.velo.abierto{opacity:1;pointer-events:auto}
.cajon{position:fixed;top:0;left:0;bottom:0;width:min(300px,84vw);overflow-y:auto;background:var(--verde-hondo);transform:translateX(-100%);transition:transform .22s;z-index:9;padding:18px 0 30px}
.cajon.abierto{transform:translateX(0)}
.cajon h2{color:#fff;font-size:13px;letter-spacing:.06em;margin:20px 20px 6px;font-weight:700}
.cajon a{display:block;padding:11px 20px;color:var(--glass);text-decoration:none;font-weight:400;cursor:pointer;border-left:4px solid transparent}
@media (hover:hover){ .cajon a:hover{background:rgba(255,255,255,.07)} }
.cajon a.activo{border-left-color:var(--lima);color:var(--lima)}
.cerrar{position:absolute;top:12px;right:14px;background:transparent;border:0;color:#fff;font-size:24px;cursor:pointer;line-height:1}

/* contenido */
.wrap{max-width:900px;margin:0 auto;padding:4px 14px 60px}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px}
.card.borde{border-left:4px solid var(--lima)}
h2.sec{color:#fff;font-weight:700;text-transform:uppercase;font-size:14px;letter-spacing:.05em;margin:20px 0 9px}
h2.sec:first-child{margin-top:6px}
h3{margin:0 0 8px;font-size:16px;font-weight:700}
.nota{font-size:12.5px;color:var(--claro);margin:2px 0 16px;max-width:62ch}
.vacio{background:rgba(255,255,255,.1);border-radius:12px;padding:22px;color:#fff;font-size:14px;text-align:center}

.fila{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
label.lab{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--gris);font-weight:600;display:block;margin-bottom:3px}
input[type=text],input[type=email],input[type=password],input[type=number],select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--linea);border-radius:8px;background:#fff}
textarea{min-height:80px;resize:vertical}
.btn{padding:10px 15px;border:0;border-radius:8px;background:var(--tinta);color:#fff;font-weight:600;cursor:pointer}
@media (hover:hover){ .btn:hover{background:var(--verde-hondo)} }
.btn.claro{background:#fff;color:var(--tinta);border:1px solid var(--linea)}
.btn.lima{background:var(--lima);color:var(--tinta)}
.btn:disabled{opacity:.5;cursor:default}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:7px 13px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;font-size:13px;cursor:pointer}
.chip.on{background:var(--lima);color:var(--tinta);border-color:var(--lima);font-weight:600}

.chip .punto{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;
  vertical-align:middle;border:1px solid rgba(0,0,0,.15)}
/* --- DIVA --- */
.diva-cab{background:#fff;border-radius:16px;padding:22px 18px 20px;text-align:center;
  margin-bottom:12px}

/* El sello: la foto y el logo son una sola pieza. El logo se asoma
   por la esquina de la foto, con borde blanco, como un emblema. */
.diva-sello{position:relative;width:148px;margin:0 auto 15px}
.diva-foto,.diva-sinfoto{width:148px;height:148px;border-radius:50%;object-fit:cover;
  object-position:center 50%;display:block;background:var(--glass);
  box-shadow:0 0 0 4px var(--lima),0 6px 18px rgba(5,59,55,.13)}
.diva-sinfoto{display:flex;align-items:center;justify-content:center;font-size:52px;
  font-weight:700;color:var(--verde)}
.diva-emblema{position:absolute;right:-6px;bottom:-4px;width:58px;height:58px;
  border-radius:50%;background:#fff;border:3px solid #fff;overflow:hidden;
  box-shadow:0 2px 9px rgba(5,59,55,.2);display:flex;align-items:center;justify-content:center}
.diva-emblema img{width:100%;height:100%;object-fit:contain;display:block}

.encuadre{display:flex;align-items:center;gap:12px;margin-top:10px}
.encuadre img{width:84px;height:84px;border-radius:50%;object-fit:cover;flex:none;
  background:var(--glass);box-shadow:0 0 0 3px var(--lima)}
.encuadre input[type=range]{flex:1;accent-color:var(--verde)}

.diva-cab h3{margin:0;font-size:21px;letter-spacing:-.01em}
.diva-sigla{display:inline-block;background:var(--lima);color:var(--tinta);
  font-size:13px;font-weight:700;letter-spacing:.2em;padding:5px 15px 5px 17px;
  border-radius:999px;margin:10px 0 0}
.diva-largo{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--gris);margin:9px 0 0;line-height:1.55}
.diva-cab .texto{margin:0;text-align:left;line-height:1.6;white-space:pre-wrap}
.diva-cab .texto::before{content:'';display:block;width:46px;height:2px;
  background:var(--linea);border-radius:2px;margin:16px auto 15px}
.reglamento{display:flex;align-items:center;gap:11px;background:#fff;border-radius:12px;
  padding:14px;margin-bottom:12px;text-decoration:none;color:var(--tinta)}
@media (hover:hover){ .reglamento:hover{background:var(--paper)} }
.reglamento svg{width:26px;height:26px;flex:none;color:var(--verde)}
.reglamento strong{display:block;font-size:15px}
.reglamento span{font-size:12.5px;color:var(--gris)}
.preg{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px}
.preg .quien{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.preg .quien strong{font-size:14.5px}
.preg .quien time{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--gris)}
.preg .texto{margin:0;line-height:1.5}
.preg .resp{margin:12px 0 0;padding:11px 13px;background:rgba(215,222,105,.26);
  border-radius:9px;border-left:3px solid var(--lima)}
.preg .resp .de{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--verde);margin:0 0 5px}
.preg .resp p{margin:0;line-height:1.5;white-space:pre-wrap}
.preg .sin-resp{margin:10px 0 0;font-size:12.5px;color:var(--gris);font-style:italic}
.muestra{width:30px;height:30px;border-radius:8px;flex:none;border:1px solid var(--linea)}
.sin-logo{font-size:12px;color:var(--gris);font-style:italic}
.cabeza-eq{display:flex;align-items:center;gap:12px;background:#fff;border-radius:12px;
  padding:14px;margin-bottom:12px}
.cabeza-eq img{width:52px;height:52px;object-fit:contain;flex:none;background:#fff;
  border:1px solid var(--linea);border-radius:10px;padding:3px;box-sizing:border-box}
.grito-chico{margin:4px 0 0;font-size:13.5px;color:var(--verde);font-weight:600}
.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.eqfila{display:flex;align-items:center;gap:11px;width:100%;background:#fff;border:0;
  border-radius:12px;padding:11px;margin-bottom:9px;cursor:pointer;font-family:inherit;text-align:left}
@media (hover:hover){ .eqfila:hover{background:var(--paper)} }
.eq-logo{width:48px;height:48px;border-radius:10px;flex:none;display:flex;align-items:center;
  justify-content:center;overflow:hidden}
.eq-logo img{width:100%;height:100%;object-fit:contain}
.eq-logo.con-logo{background:#fff;padding:4px;box-sizing:border-box}
.eq-foto{width:76px;height:48px;border-radius:7px;object-fit:cover;flex:none;background:var(--glass)}
.eq-foto.vacia{display:flex;align-items:center;justify-content:center;font-size:10.5px;
  color:var(--gris);font-style:italic}
.eq-datos{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.eq-datos strong{font-size:15.5px}
.eq-datos span{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--gris)}
.foto-equipo{display:block;width:100%;border-radius:10px;margin-bottom:11px;background:var(--glass)}
.desc-equipo{margin:0;line-height:1.55;white-space:pre-wrap}

table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;margin-bottom:8px}
.tabla-caja{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:8px;border-radius:12px}
.tabla-caja table{margin-bottom:0;min-width:max-content}
.tabla-caja th:first-child,.tabla-caja td:first-child{position:sticky;left:0;background:#fff}
.tabla-caja thead th:first-child{background:var(--glass)}
th{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--gris);padding:8px 5px;text-align:right;border-bottom:1px solid var(--linea);white-space:nowrap}
th:nth-child(2){text-align:left}
td{padding:8px 5px;border-bottom:1px solid var(--glass);text-align:right;font-family:'IBM Plex Mono',monospace;font-size:13px;white-space:nowrap}
td:nth-child(2){text-align:left;font-family:'Poppins',sans-serif;font-weight:600}
tr:last-child td{border-bottom:0}
.pos{color:var(--gris);font-size:11px}
.pts{font-weight:700;background:rgba(215,222,105,.34)}
@media(max-width:600px){th:nth-child(6),td:nth-child(6),th:nth-child(8),td:nth-child(8){display:none}th,td{padding:8px 4px;font-size:12.5px}}

.cat{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;background:var(--tinta);color:var(--lima);padding:3px 7px;border-radius:4px}
.avisito{padding:9px 12px;border-radius:8px;font-size:13px;margin-bottom:10px}
.avisito.mal{background:rgba(217,72,47,.1);color:var(--alerta)}
.avisito.bien{background:rgba(215,222,105,.35);color:var(--tinta)}
.cargando{color:#fff;text-align:center;padding:40px 0;font-size:14px}
.hora{display:flex;align-items:center;gap:8px;margin:18px 0 7px}
.hora b{color:#fff;font-family:'IBM Plex Mono',monospace;font-size:15px;letter-spacing:.04em}
.hora span{flex:1;height:1px;background:rgba(255,255,255,.28)}
.pj{background:#fff;border-radius:10px;padding:11px 13px;margin-bottom:7px;border-left:4px solid transparent}
.pj.mio{border-left-color:var(--lima);background:#FBFDEE}
.pj .arriba{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.pj .cancha{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--gris)}
.pj .duelo{font-weight:600;font-size:14.5px;line-height:1.3}
.pj .duelo em{font-style:normal;color:var(--gris);font-weight:400;padding:0 4px}
.pj .marca{display:inline-block;background:var(--lima);color:var(--tinta);font-size:10px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:999px;margin-top:6px}

/* Los dos lados de un partido, con el color del equipo adelante. */
.lado{display:flex;align-items:center;gap:8px;min-width:0}
.lado .punto{width:9px;height:9px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.15)}
.lado-n{font-weight:600;font-size:14.5px;line-height:1.25;min-width:0}
.lado-e{font-size:11.5px;color:var(--gris);margin-left:auto;flex:none;padding-left:8px}
.versus{font-size:11px;color:var(--gris);margin:3px 0 3px 17px;letter-spacing:.06em}

/* La tarjeta grande del próximo partido de la jugadora. */
.proximo{background:linear-gradient(150deg,var(--verde) 0%,var(--verde-hondo) 100%);
  border-radius:16px;padding:20px 18px;margin-bottom:14px;color:#fff;text-align:center}
.proximo .cuenta{display:inline-block;background:var(--lima);color:var(--tinta);font-size:12px;
  font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:5px 14px;border-radius:999px}
.proximo .cuando{margin:12px 0 0;font-size:13px;color:var(--claro)}
.proximo .hora-grande{margin:2px 0 0;font-family:'IBM Plex Mono',monospace;font-size:34px;
  font-weight:600;letter-spacing:-.02em}
.proximo .hora-grande span{font-size:14px;font-weight:400;color:var(--claro);letter-spacing:0}
.proximo .contra{display:flex;align-items:stretch;gap:10px;margin-top:16px;text-align:left}
.proximo .contra-lado{flex:1;min-width:0;background:rgba(255,255,255,.12);border-radius:12px;padding:11px 12px}
.proximo .contra-lado.der{text-align:right}
.proximo .contra-lado .rot{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--claro);margin-bottom:4px}
.proximo .contra-lado strong{display:block;font-size:15px;line-height:1.25}
.proximo .contra-lado .eqn{display:block;font-size:11.5px;color:var(--claro);margin-top:3px}
.proximo .contra-lado .punto{display:inline-block;width:8px;height:8px;border-radius:50%;
  margin-right:5px;border:1px solid rgba(255,255,255,.4)}
.proximo .contra-vs{align-self:center;font-size:12px;color:var(--claro);letter-spacing:.06em}
.proximo .arenga{margin:14px 0 0;font-size:13.5px;font-style:italic;color:var(--claro)}

/* El resumen de la fecha, arriba de la programación. */
.resumen{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);
  border-radius:14px;padding:15px 16px;margin-bottom:14px;color:#fff}
.resumen .cuenta{display:inline-block;background:var(--lima);color:var(--tinta);font-size:11px;
  font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:4px 11px;border-radius:999px}
.resumen .cuando{margin:10px 0 0;font-size:16px;font-weight:600}
.resumen .cifra{margin:2px 0 0;font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600}
.resumen .detalle{margin:3px 0 0;font-size:12.5px;color:var(--claro)}
.resumen .tuyo{margin:11px 0 0;padding-top:11px;border-top:1px solid rgba(255,255,255,.18);
  font-size:13.5px;color:var(--lima)}
.resumen .tuyo b{color:#fff}

/* El título grande de la fecha elegida. */
.titulo-fecha{margin:16px 0 13px}
.titulo-fecha h3{margin:0;font-size:30px;line-height:1.05;color:#fff;letter-spacing:-.02em}
.titulo-fecha p{margin:5px 0 0;font-size:13.5px;color:var(--lima)}

/* --- La parrilla del fixture --- */
/* Sin ajuste magnético: con él el navegador empujaba la columna de
   la hora fuera de la pantalla al abrir la pantalla. */
.parrilla-caja{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:5px}
.parrilla{display:grid;grid-template-columns:62px repeat(var(--canchas), minmax(172px, 1fr));
  gap:6px;min-width:min-content}
.parrilla .cab{background:var(--verde-hondo);color:#fff;font-size:11px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;text-align:center;padding:9px 6px;
  border-radius:9px;display:flex;align-items:center;justify-content:center;line-height:1.15}
.parrilla .hcol{position:sticky;left:0;z-index:2;background:var(--lima);color:var(--tinta);
  font-family:'IBM Plex Mono',monospace;font-size:13.5px;font-weight:600;overflow-wrap:anywhere;
  display:flex;align-items:center;justify-content:center;border-radius:9px;
  padding:6px 2px;text-align:center;line-height:1.15}
.parrilla .hcol.cab{background:var(--verde-hondo);color:#fff;font-family:inherit;font-size:11px}
.parrilla .celda{background:#fff;border-radius:11px;padding:10px 11px;
  display:flex;flex-direction:column;gap:5px;min-width:0}
.parrilla .celda.libre{align-items:center;justify-content:center;color:var(--linea);
  background:rgba(255,255,255,.1);font-size:18px}
.parrilla .celda.mio{box-shadow:inset 0 0 0 2px var(--lima)}
.parrilla .celda.suspendido{opacity:.72}
.parrilla .celda .cat{align-self:flex-start}
.parrilla .pareja{min-width:0}
.parrilla .pareja b{display:block;font-size:13.5px;line-height:1.2;overflow-wrap:anywhere}
.parrilla .pareja.gana b{color:var(--verde)}
.parrilla .pareja.gana b::after{content:' ★';font-size:10px;vertical-align:2px}
.parrilla .pareja span{display:block;font-size:10.5px;color:var(--gris);letter-spacing:.04em;
  text-transform:uppercase;margin-top:2px;overflow-wrap:anywhere}
.parrilla .pareja i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;
  border:1px solid rgba(0,0,0,.15)}
.parrilla .medio{font-size:11px;color:var(--gris);letter-spacing:.08em;text-transform:uppercase;
  border-top:1px solid var(--glass);border-bottom:1px solid var(--glass);padding:4px 0;text-align:center}
.parrilla .medio .res{font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:700;
  color:var(--tinta);letter-spacing:0;text-transform:none}
.parrilla .medio .susp{color:var(--alerta);font-weight:700;font-size:10px}
.parrilla .celda .tetoca{align-self:flex-start;width:auto;margin:0;background:var(--lima);
  color:var(--tinta);font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  padding:3px 9px;border-radius:999px}
/* --- La capitana del equipo --- */
.capitana{display:flex;align-items:center;gap:12px;background:var(--paper);
  border:1px solid var(--linea);border-radius:12px;padding:10px 12px;margin:0 0 12px}
.capitana img,.capitana .sincap{width:52px;height:52px;border-radius:50%;object-fit:cover;flex:none;
  background:var(--glass);box-shadow:0 0 0 3px var(--lima)}
.capitana .sincap{display:flex;align-items:center;justify-content:center;font-size:21px;
  font-weight:700;color:var(--verde)}
.capitana .rot{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--gris);font-weight:700}
.capitana strong{font-size:16px;line-height:1.2}

/* --- Los auspiciadores --- */
.auspicios{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.auspicio{background:#fff;border-radius:13px;padding:14px 12px;text-align:center;
  text-decoration:none;color:var(--tinta);display:flex;flex-direction:column;align-items:center;
  gap:8px;justify-content:flex-start}
@media (hover:hover){ a.auspicio:hover{background:var(--paper)} }
.auspicio img{width:100%;height:76px;object-fit:contain;display:block}
.auspicio .sin-logo-aus{width:72px;height:72px;border-radius:14px;background:var(--glass);
  color:var(--verde);font-size:30px;font-weight:700;display:flex;align-items:center;
  justify-content:center}
.auspicio strong{font-size:13.5px;line-height:1.25}
.auspicio span{font-size:11.5px;color:var(--gris);line-height:1.35}

/* --- Cómo va un equipo --- */
.marcha{display:flex;gap:8px;background:#fff;border-radius:13px;padding:13px 10px;margin-bottom:12px}
.marcha div{flex:1;text-align:center;min-width:0}
.marcha b{display:block;font-family:'IBM Plex Mono',monospace;font-size:22px;line-height:1.1}
.marcha span{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--gris);margin-top:3px}
.marcha .pts-eq b{color:var(--verde)}
.veredicto-chip{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  padding:3px 9px;border-radius:999px}
.veredicto-chip.gano{background:var(--lima);color:var(--tinta)}
.veredicto-chip.perdio{background:var(--glass);color:var(--gris)}

/* La pastilla del tirón para actualizar. */
.tiron{position:fixed;top:0;left:50%;z-index:20;transform:translate(-50%,-60px);opacity:0;
  background:var(--verde-hondo);color:#fff;font-size:12.5px;font-weight:600;
  padding:8px 18px;border-radius:999px;box-shadow:0 4px 14px rgba(5,59,55,.3);
  transition:transform .18s,opacity .18s;pointer-events:none;white-space:nowrap}
.tiron.listo{background:var(--lima);color:var(--tinta)}

.desliza{font-size:11.5px;color:var(--claro);margin:8px 0 0;text-align:right}
@media (min-width:620px){ .desliza{display:none} }

/* La rejilla para cargar el marcador. */
.marcador .rejilla{display:grid;grid-template-columns:1fr 50px 50px 50px;gap:7px;
  align-items:center;margin-top:12px}
.marcador .rejilla .rot{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--gris);font-weight:700;text-align:center;line-height:1.1}
.marcador .rejilla .rn{font-size:13.5px;font-weight:600;line-height:1.2;min-width:0;
  color:var(--tinta);font-family:inherit;letter-spacing:0;overflow-wrap:anywhere}
.marcador .rejilla .rn span{display:block;font-size:11px;color:var(--gris);font-weight:400;
  margin-top:2px}
.marcador .rejilla .rn i{display:inline-block;width:7px;height:7px;border-radius:50%;
  margin-right:5px;border:1px solid rgba(0,0,0,.15)}
.marcador .rejilla input{width:100%;text-align:center;font-family:'IBM Plex Mono',monospace;
  font-size:18px;font-weight:600;padding:9px 0;margin:0}
.marcador .pista{font-size:11.5px;color:var(--gris);margin:9px 0 0}
.veredicto{background:var(--paper);border:1px solid var(--linea);border-radius:11px;
  padding:11px 13px;margin-top:12px}
.veredicto strong{display:block;font-size:15px}
.veredicto > span{font-size:12.5px;color:var(--gris)}
.veredicto .reparto{display:flex;gap:10px;margin-top:9px;flex-wrap:wrap}
.veredicto .reparto span{flex:1;min-width:110px;background:#fff;border-radius:8px;padding:7px 10px;
  font-size:12.5px;color:var(--gris);display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.veredicto .reparto b{font-family:'IBM Plex Mono',monospace;font-size:17px;color:var(--verde)}
.dupla{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--glass)}
.dupla:last-child{border-bottom:0}
.dupla.tocable{cursor:pointer}
@media (hover:hover){ .dupla.tocable:hover{background:var(--paper)} }
.dupla .flecha{color:var(--gris);font-size:19px;line-height:1;margin-left:auto;padding-left:8px;
  transition:transform .18s}
.dupla .flecha.arriba{transform:rotate(180deg)}
.dupla-abierta{padding:2px 0 14px}
.foto-grande{display:block;width:100%;border-radius:12px;background:var(--glass)}
.foto-grande.vacia{aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;
  color:var(--gris);font-size:13.5px}
.desc-dupla{margin:11px 0 0;font-size:14px;line-height:1.55;color:var(--tinta);white-space:pre-wrap}
.dupla img,.dupla .sinfoto-dupla{width:52px;height:52px;border-radius:8px;object-fit:cover;
  background:var(--glass);flex:none}
.dupla .n{font-weight:600;font-size:14px}
.dupla .c{font-size:12px;color:var(--gris)}
/* --- noticias --- */
.bienvenida{text-align:center;padding:6px 10px 18px}
.escudo{display:block;width:min(270px,66vw);height:auto;margin:0 auto 10px}
.bienvenida h2{color:#fff;font-size:24px;font-weight:700;line-height:1.15;margin:0}
.bienvenida p{color:var(--claro);font-size:14px;margin:8px 0 0;max-width:30ch;
  margin-left:auto;margin-right:auto}
.aparte{display:flex;flex-direction:column;align-items:center;gap:14px;margin:18px 0 20px}
.btn.grande{padding:14px 26px;font-size:16px;border-radius:10px}
.enlace{background:none;border:0;color:var(--claro);font-family:inherit;font-size:13.5px;
  cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:6px 2px}
@media (hover:hover){ .enlace:hover{color:var(--lima)} }
.lista-nombres{margin-top:10px;max-height:330px;overflow-y:auto}
.nombre{display:flex;align-items:center;gap:11px;width:100%;
  background:#fff;border:0;border-bottom:1px solid var(--glass);padding:9px 4px;
  text-align:left;cursor:pointer;font-family:inherit}
@media (hover:hover){ .nombre:hover{background:var(--paper)} }
.avatar{width:52px;height:52px;border-radius:11px;flex:none;display:flex;
  align-items:center;justify-content:center;font-size:24px;font-weight:700;line-height:1}
.avatar.chico{width:38px;height:38px;font-size:17px;border-radius:9px}
.avatar.con-logo{overflow:hidden;background:#fff;padding:4px;box-sizing:border-box}
.avatar.con-logo img{width:100%;height:100%;object-fit:contain}
.nombre div{display:flex;flex-direction:column;gap:1px;min-width:0}
.nombre strong{font-size:15px}
.nombre span{font-size:12px;color:var(--gris)}
.sinres{font-size:13px;color:var(--gris);padding:10px 4px;margin:0}
.muro{display:grid;grid-template-columns:repeat(auto-fill,minmax(134px,1fr));gap:10px}
.mural{background:#fff;border-radius:12px;overflow:hidden;cursor:pointer}
.mural img,.mural .sinfoto{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--glass)}
.mural .pie{padding:9px 10px 11px;display:flex;flex-direction:column;gap:2px}
.mural .pie strong{font-size:13px;line-height:1.25}
.mural .pie span{font-size:11px;color:var(--gris)}
.grito .frase{margin:0;font-size:18px;font-weight:700;line-height:1.3;color:var(--verde)}
.etq{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  padding:4px 9px;border-radius:999px;background:var(--lima);color:var(--tinta)}
.etq.cronica{background:var(--lima)}
.etq.resultados{background:#fff;color:var(--verde)}
.etq.aviso{background:#FFD166;color:#5A3D00}
.etq.galeria{background:#BDE4DE;color:var(--tinta)}
.etq-lista{display:flex;flex-wrap:wrap;gap:8px}
.etq-chip{display:inline-flex;align-items:center;gap:4px;background:var(--paper);
  border:1px solid var(--linea);border-radius:999px;padding:3px 4px 3px 5px}
.etq-chip button{border:0;background:transparent;color:var(--gris);font-size:16px;
  line-height:1;cursor:pointer;padding:0 4px}
@media (hover:hover){ .etq-chip button:hover{color:var(--alerta)} }
.portada{position:relative;border-radius:14px;overflow:hidden;background:#fff;margin-bottom:14px;cursor:pointer}
.portada .foto{position:relative;aspect-ratio:16/10;background:var(--verde-hondo)}
.portada .foto img{width:100%;height:100%;object-fit:cover;display:block}
.portada .velo2{position:absolute;inset:0;background:linear-gradient(to top,rgba(5,59,55,.88) 12%,rgba(5,59,55,.15) 62%,transparent)}
.portada .sobre{position:absolute;left:0;right:0;bottom:0;padding:16px}
.portada h3{color:#fff;font-size:21px;line-height:1.15;margin:8px 0 0;text-shadow:0 1px 8px rgba(0,0,0,.35)}
.portada .cuerpo{padding:13px 16px 15px}
.portada .baj{color:var(--gris);font-size:14px;margin:0}
.fechita{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--gris);letter-spacing:.04em}
.nota-mini{display:flex;gap:12px;background:#fff;border-radius:12px;padding:11px;margin-bottom:9px;cursor:pointer;align-items:center}
.nota-mini .th{width:78px;height:78px;border-radius:9px;object-fit:cover;flex:none;background:var(--glass)}
.nota-mini .tx{min-width:0}
.nota-mini h4{margin:6px 0 4px;font-size:15px;line-height:1.25}
.detalle .hero{width:100%;border-radius:14px;margin-bottom:14px;display:block}
.detalle h3{font-size:23px;line-height:1.15;margin:10px 0}
.detalle .baj{font-size:16px;color:var(--gris);margin:0 0 14px}
.detalle .txt{white-space:pre-wrap;line-height:1.6}
.borrador{background:rgba(217,72,47,.1);color:var(--alerta);font-size:12px;padding:6px 10px;border-radius:8px;margin-top:10px}
.prev{max-height:340px;overflow:auto;border:1px solid var(--linea);border-radius:8px;margin:10px 0}

.mal{color:var(--alerta)}

let yo = null;                // jugadora conectada
let jorAdm = null;            // fecha abierta en el editor de programación
let partidoEdit = null;       // partido que se está editando
let resultadoEdit = null;     // partido al que se le está cargando el marcador
let auspicioEdit = null;      // auspiciador que se está editando
let filtroFecha = 'todas';
let equipoAbierto = null;
let duplaAbierta = null;

const $  = s => document.querySelector(s);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cat = id => D.categorias.find(c => c.id === id)?.codigo ?? '';
const eq  = id => D.equipos.find(e => e.id === id)?.nombre ?? '';
const colorEq = id => D.equipos.find(e => e.id === id)?.color || '#CBDDD9';

/* El equipo de cada lado de un partido. La base lo guarda aparte,
   pero si por lo que sea quedó vacío, se saca de la dupla: así la
   app nunca muestra un partido sin equipo. */
const eqDupla = duplaId => D.duplas.find(d => d.id === duplaId)?.equipo_id ?? null;
const ladoA = p => p.equipo_a ?? eqDupla(p.dupla_a);
const ladoB = p => p.equipo_b ?? eqDupla(p.dupla_b);

/* "Jopa y Jesu". Si la dupla todavía no tiene nombres, el equipo. */
const nomDupla = id => {
  const d = D.duplas.find(x => x.id === id);
  if(!d) return 'Por definir';
  const js = [d.jugadora_1, d.jugadora_2]
    .map(i => D.jugadoras.find(j => j.id === i)?.nombre).filter(Boolean);
  return js.length ? js.join(' y ') : (eq(d.equipo_id) || 'Por definir');
};

/* Las duplas de la jugadora conectada: una A/B puede además jugar
   en la dupla B de su equipo, así que son varias, no una. */
const misDuplas = () => !yo ? []
  : D.duplas.filter(d => d.jugadora_1 === yo.jugadora_id || d.jugadora_2 === yo.jugadora_id)
            .map(d => d.id);
const esMio = p => { const m = misDuplas(); return m.includes(p.dupla_a) || m.includes(p.dupla_b); };
const fotoDupla = url => url
  ? `<img src="${esc(url)}" alt="">`
  : `<div class="sinfoto-dupla" aria-hidden="true"></div>`;

/* Inicial de la jugadora sobre el color de su equipo.
   El texto se oscurece o aclara según lo claro que sea el fondo. */
const claro = hex => {
  const c = String(hex || '').replace('#','');
  if(c.length !== 6) return false;
  const [r,g,b] = [0,2,4].map(i => parseInt(c.slice(i,i+2),16));
  return (0.299*r + 0.587*g + 0.114*b) > 150;
};
const logoEq = id => D.equipos.find(e => e.id === id)?.logo_url || null;

/* El círculo de cada jugadora: el logo de su equipo si ya lo subieron,
   y mientras tanto su inicial sobre el color del equipo. */
const inicial = (nombre, equipoId, clase) => {
  const col = colorEq(equipoId), logo = logoEq(equipoId);
  /* Con logo el fondo va blanco, no del color del equipo: muchos logos
     no llenan el cuadrado y el color sobrante se ve como un parche. El
     color queda en el borde, que para eso está. */
  if(logo) return `<span class="${clase} con-logo"
    style="box-shadow:inset 0 0 0 2px ${esc(col)}, 0 0 0 1px var(--linea)"
    aria-hidden="true"><img src="${esc(logo)}" alt=""></span>`;
  return `<span class="${clase}" style="background:${esc(col)};color:${claro(col)?'#053B37':'#fff'}"
    aria-hidden="true">${esc((nombre || '?').trim().charAt(0).toUpperCase())}</span>`;
};
const signo = n => (n > 0 ? '+' : '') + n;
const fechaLarga = f => new Date(f + 'T12:00:00')
  .toLocaleDateString('es-CL', { weekday:'long', day:'numeric', month:'long' });

/* ---------- datos ---------- */
const t = async (n, o) => (await sb.from(n).select('*').order(o ?? 'id')).data ?? [];

/* Lo indispensable para dibujar cualquier pantalla. Van todas las
   consultas juntas, no una detrás de otra: en un teléfono con poca
   señal, cada ida y vuelta al servidor se nota. */
async function cargarBase(){
  const [cat, eqs, jug, dup, jor, par] = await Promise.all([
    t('categorias','orden'), t('equipos','orden'), t('jugadoras','nombre'),
    t('duplas'), t('jornadas','numero'), t('partidos')
  ]);
  D.categorias = cat; D.equipos = eqs; D.jugadoras = jug;
  D.duplas = dup; D.jornadas = jor; D.partidos = par;
  vincularFicha();
}

/* Lo demás: tablas calculadas, noticias, la DIVA. Se pide después
   de haber pintado, así la app aparece antes. */
async function cargarResto(){
  const [tab, ran, aju, pre, not, div, etq] = await Promise.all([
    t('v_tabla_equipos'), t('v_ranking_duplas'), t('ajustes'),
    sb.from('preguntas').select('*').order('creada_en',{ascending:false}).then(r => r.data ?? []),
    sb.from('noticias').select('*').order('publicada_en',{ascending:false}).then(r => r.data ?? []),
    sb.from('diva').select('*').eq('id',1).maybeSingle().then(r => r.data ?? null),
    /* La tabla de etiquetas puede no existir todavía: si falla, se
       siguen usando las cuatro de siempre y la app no se cae. */
    t('etiquetas','orden')
  ]);
  D.tabla = tab; D.ranking = ran; D.ajustes = aju;
  D.preguntas = pre; D.noticias = not; D.diva = div; D.etiquetas = etq;
}

async function cargar(){
  await Promise.all([cargarBase(), cargarResto()]);
}

/* Si la administradora también juega, cargamos su perfil de jugadora
   sin que tenga que entrar de nuevo con nombre y código. */
function vincularFicha(){
  if(!sesion || !miFicha) return;
  const j = D.jugadoras.find(x => x.id === miFicha);
  if(!j) return;
  const d = D.duplas.find(x => x.jugadora_1 === j.id || x.jugadora_2 === j.id);
  yo = { jugadora_id:j.id, nombre:j.nombre, equipo_id:j.equipo_id, dupla_id:d?.id ?? null };
}

/* ---------- sesión ---------- */
/* No basta con que exista una sesión guardada: hay que comprobar que
   Supabase todavía acepte escribir. El permiso caduca cada cierto rato. */
async function permisoReal(){
  const r = await sb.rpc('es_admin');
  if(!r.error) return r.data === true;
  const { data:p, error } = await sb.from('perfiles')
    .select('id').eq('id', sesion.user.id).maybeSingle();
  return !error && !!p;
}

async function revisarSesion(){
  const { data } = await sb.auth.getSession();
  sesion = data.session ?? null;

  if(sesion){
    let ok = await permisoReal();
    if(!ok){
      /* intentamos renovar antes de rendirnos */
      const { data:nueva } = await sb.auth.refreshSession();
      if(nueva?.session){ sesion = nueva.session; ok = await permisoReal(); }
    }
    if(!ok){ await sb.auth.signOut(); sesion = null; }
  }

  miFicha = null;
  if(sesion){
    try{
      const { data:p } = await sb.from('perfiles')
        .select('jugadora_id, es_diva').eq('id', sesion.user.id).maybeSingle();
      miFicha = p?.jugadora_id ?? null;
      soyDiva = !!p?.es_diva;
    }catch(e){ miFicha = null; soyDiva = false; }
  }

  const g = localStorage.getItem('batalla:jugadora');
  if(g && !sesion){ try{ yo = JSON.parse(g); }catch(e){ yo = null; } }
  pintarMenu();
}

/* Si el permiso se cae mientras la app está abierta, avisamos en vez
   de dejarla fallando en silencio. */
function caducada(e){
  const t = (e?.message || '') + (e?.code || '');
  return /jwt|expired|row-level|policy|401|permission/i.test(t);
}

function pintarMenu(){
  $('#grupo-admin').hidden = !sesion;
  $('#lnk-salir').hidden   = !(yo || sesion);
  $('#lnk-entrar').hidden  = !!(yo || sesion);
  $('#quien').textContent = sesion && yo ? 'Administradora y jugadora · ' + yo.nombre
                          : sesion         ? 'Administradora · ' + sesion.user.email
                          : yo             ? 'Jugadora · ' + yo.nombre
                          : 'Público';
}

/* ---------- navegación ---------- */
const cajon = (abrir) => {
  $('#cajon').classList.toggle('abierto', abrir);
  $('#velo').classList.toggle('abierto', abrir);
};
$('#abrir').onclick  = () => cajon(true);
$('#cerrar').onclick = () => cajon(false);
$('#velo').onclick   = () => cajon(false);

function irA(a){
    if(a.dataset.adm){ vista = 'admin'; subAdm = a.dataset.adm; }
    else { vista = a.dataset.vista; if(a.dataset.sub) subPerfil = a.dataset.sub; }
    equipoAbierto = null; noticiaAbierta = null;
    document.querySelectorAll('.cajon a').forEach(o => o.classList.remove('activo'));
    if(a.closest('.cajon')) a.classList.add('activo');
    document.querySelectorAll('#navbar button').forEach(b =>
      b.classList.toggle('on', b.dataset.vista === vista));
    cajon(false);
    pintar();
}

function clicMenu(ev){
  const a = ev.target.closest('a[data-vista],a[data-adm],#navbar button[data-vista]');
  if(!a) return;
  try{ irA(a); }
  catch(e){
    cajon(false);
    $('#pantalla').className = '';
    $('#pantalla').innerHTML = `<div class="vacio">No se pudo abrir esta sección.<br><br>
      <span class="mono" style="font-size:12px">${esc(e.message)}</span></div>`;
    console.error(e);
  }
}

$('#cajon').addEventListener('click', clicMenu);
$('#navbar').addEventListener('click', clicMenu);
$('#lnk-salir').onclick = async () => {
  await sb.auth.signOut();
  localStorage.removeItem('batalla:jugadora');
  sesion = null; yo = null; miFicha = null; soyDiva = false; vista = 'entrar';
  pintarMenu(); cajon(false); pintar();
};

/* ============================================================
   PANTALLAS
   ============================================================ */
function pintar(){
  const p = $('#pantalla');
  p.className = '';
  const f = { resultados:vResultados, equipos:vEquipos, perfil:vPerfil, programacion:vProgramacion,
              noticias:vNoticias, diva:vDiva, entrar:vEntrar, admin:vAdmin,
              auspiciadores:vAuspiciadores }[vista] ?? vResultados;
  const puerta = vista === 'entrar';
  $('#navbar').classList.toggle('oculta', puerta);
  $('#abrir').classList.toggle('oculta', puerta);
  document.querySelector('.top').classList.toggle('oculta', puerta);
  try{
    p.innerHTML = f();
    enlazar();
  }catch(e){
    p.innerHTML = `<div class="vacio">Algo falló al mostrar esta sección.<br><br>
      <span class="mono" style="font-size:12px">${esc(e.message)}</span><br><br>
      <span style="font-size:12px">Mándale este mensaje a quien construyó la app.</span></div>`;
    console.error(e);
  }
}

/* --- resultados --- */
function vResultados(){
  const chips = ['partidos','equipos','duplas'].map(s =>
    `<button class="chip ${subRes===s?'on':''}" data-sub="${s}">${
      {partidos:'Partidos',equipos:'Tabla de equipos',duplas:'Ranking de duplas'}[s]}</button>`).join('');
  let cuerpo = '';
  if(subRes === 'partidos'){
    const fechas = ['todas', ...D.jornadas.map(j => j.id)];
    cuerpo = `<div class="chips">${fechas.map(f =>
      `<button class="chip ${String(filtroFecha)===String(f)?'on':''}" data-fecha="${f}">${
        f==='todas' ? 'Todas' : esc(D.jornadas.find(j=>j.id===f).nombre)}</button>`).join('')}</div>`;
    cuerpo += tituloFecha(filtroFecha === 'todas' ? null : D.jornadas.find(j => j.id === filtroFecha));
    const lista = D.partidos.filter(p => filtroFecha==='todas' || p.jornada_id===filtroFecha);
    cuerpo += lista.length ? lista.map(x => tarjetaPartido(x, filtroFecha !== 'todas')).join('')
      : `<div class="vacio">Todavía no hay partidos programados. Las administradoras los cargan en la sección de administración.</div>`;
  }
  if(subRes === 'equipos'){
    cuerpo = tablaEquipos().some(x => x.pj) ? tablaPos(tablaEquipos(),'Equipo') : sinDatos();
    if(D.ajustes.length) cuerpo += `<p class="nota">Incluye puntos extra: ${
      D.ajustes.map(a => `${esc(eq(a.equipo_id))} ${a.puntos>0?'+':''}${a.puntos} (${esc(a.motivo)})`).join(' · ')}</p>`;
  }
  if(subRes === 'duplas'){
    cuerpo = D.ranking.length ? D.categorias.map(c => {
      const l = D.ranking.filter(r => r.categoria === c.codigo);
      return l.length ? `<h2 class="sec">Categoría ${esc(c.codigo)}</h2>` + tablaPos(l,'Dupla') : '';
    }).join('') : sinDatos();
  }
  return `<h2 class="sec">Resultados</h2><div class="chips">${chips}</div>${cuerpo}`;
}
const sinDatos = () => `<div class="vacio">Aún no hay partidos jugados. La tabla aparece sola en cuanto se cargue el primer resultado.</div>`;

function tarjetaPartido(p, sinFecha){
  const j = sinFecha ? null : D.jornadas.find(x => x.id === p.jornada_id);
  const marcador = p.estado === 'jugado'
    ? `<span class="mono">${p.set1_a}-${p.set1_b} · ${p.set2_a}-${p.set2_b}${p.stb_a!=null?` · ${p.stb_a}-${p.stb_b}`:''}</span>`
    : `<span class="mono" style="color:var(--gris)">${p.hora ? p.hora.slice(0,5) : 'por jugar'}${p.cancha?' · cancha '+esc(p.cancha):''}</span>`;
  return `<div class="card"><div class="fila" style="margin:0">
      <span class="cat">${esc(cat(p.categoria_id))}</span>
      <span style="font-size:12px;color:var(--gris)">${j?esc(j.nombre):''}</span>
      <span style="margin-left:auto">${marcador}</span></div>
    ${ladoPartido(p.dupla_a, ladoA(p))}
    <div class="versus">vs</div>
    ${ladoPartido(p.dupla_b, ladoB(p))}
  </div>`;
}

/* Un lado del partido: el punto del color del equipo, los dos
   nombres, y abajo chiquito el equipo. */
function ladoPartido(duplaId, equipoId){
  return `<div class="lado">
    <span class="punto" style="background:${esc(colorEq(equipoId))}"></span>
    <span class="lado-n">${esc(nomDupla(duplaId))}</span>
    <span class="lado-e">${esc(eq(equipoId))}</span>
  </div>`;
}

function tablaPos(lista, etiqueta){
  return `<div class="tabla-caja"><table><thead><tr><th>#</th><th>${etiqueta}</th><th>PJ</th><th>G</th><th>P</th>
    <th>Sets</th><th>±S</th><th>Games</th><th>±G</th><th>Pts</th></tr></thead><tbody>` +
    lista.map((f,i) => `<tr ${f.equipo_id&&etiqueta==='Equipo'?`data-equipo="${f.equipo_id}" style="cursor:pointer"`:''}><td class="pos">${i+1}</td>
      <td>${esc(f.nombre ?? f.equipo)}</td><td>${f.pj}</td><td>${f.pg}</td><td>${f.pp}</td>
      <td>${f.sets_g ?? '—'}${f.sets_g!=null?'-'+f.sets_p:''}</td><td>${signo(f.dif_sets)}</td>
      <td>${f.games_g ?? '—'}${f.games_g!=null?'-'+f.games_p:''}</td><td>${signo(f.dif_games)}</td>
      <td class="pts">${f.puntos}</td></tr>`).join('') + `</tbody></table></div>`;
}

/* El título grande de una fecha: el número arriba y la fecha del
   calendario abajo. Se usa en Resultados y en Administración. */
function tituloFecha(jor, cola){
  if(!jor) return `<div class="titulo-fecha"><h3>Todas las fechas</h3>
    <p>El torneo completo, de la primera a la última.</p></div>`;
  return `<div class="titulo-fecha">
    <h3>${esc(jor.nombre)}</h3>
    <p>${esc(mayus(fechaLarga(jor.fecha)))}${cola ? ' · ' + esc(cola) : ''}</p>
  </div>`;
}

/* Cómo se le dice a cada estado en pantalla. */
const ESTADOS = { programado:'', jugado:'', suspendido:'suspendido',
                  pendiente:'por reprogramar', wo:'no se presentaron' };
const rotuloEstado = p => ESTADOS[p.estado] || '';

/* La parrilla de la fecha: las horas abajo a la izquierda y una
   columna por cancha, como el cuadro que arman las organizadoras.
   En el teléfono la columna de la hora queda fija y las canchas se
   deslizan de lado. */
function parrilla(lista){
  const canchas = [...new Set(lista.map(p => p.cancha).filter(Boolean))]
    .sort((a,b) => String(a).localeCompare(String(b), 'es', { numeric:true }));
  const horas = [...new Set(lista.map(p => p.hora ? p.hora.slice(0,5) : 'Por definir'))].sort();
  if(!canchas.length) canchas.push(null);

  const celdas = horas.map(h => {
    const fila = canchas.map(c => {
      const p = lista.find(x => (x.hora ? x.hora.slice(0,5) : 'Por definir') === h
                             && (c === null || x.cancha === c));
      if(!p) return `<div class="celda libre">—</div>`;
      const jugado = p.estado === 'jugado' && p.set1_a != null;
      const gA = jugado && cuentaPartido(p, p.es_final).setsA > cuentaPartido(p, p.es_final).setsB;
      return `<div class="celda ${esMio(p) ? 'mio' : ''} ${rotuloEstado(p) ? 'suspendido' : ''}">
        <span class="cat">${esc(cat(p.categoria_id))}</span>
        ${ladoParrilla(p.dupla_a, ladoA(p), jugado && gA)}
        <div class="medio">${jugado
          ? `<span class="res">${esc(marcadorTexto(p))}</span>`
          : rotuloEstado(p) ? `<span class="susp">${esc(rotuloEstado(p))}</span>` : 'vs'}</div>
        ${ladoParrilla(p.dupla_b, ladoB(p), jugado && !gA)}
        ${esMio(p) ? '<span class="tetoca">Te toca</span>' : ''}
      </div>`;
    }).join('');
    return `<div class="hcol">${esc(h)}</div>${fila}`;
  }).join('');

  return `<div class="parrilla-caja">
      <div class="parrilla" style="--canchas:${canchas.length}">
        <div class="hcol cab">Hora</div>
        ${canchas.map(c => `<div class="cab">${c === null ? 'Partidos' : 'Cancha ' + esc(c)}</div>`).join('')}
        ${celdas}
      </div>
    </div>
    ${canchas.length > 1 ? '<p class="desliza">Desliza de lado para ver las otras canchas →</p>' : ''}`;
}

function ladoParrilla(duplaId, equipoId, ganadora){
  return `<div class="pareja ${ganadora ? 'gana' : ''}">
    <b>${esc(nomDupla(duplaId))}</b>
    <span><i style="background:${esc(colorEq(equipoId))}"></i>${esc(eq(equipoId))}</span>
  </div>`;
}

/* --- programación semanal --- */
function vProgramacion(){
  if(!D.jornadas.length)
    return `<h2 class="sec">Programación</h2><div class="vacio">Todavía no hay fechas cargadas.</div>`;

  if(jornadaProg === null){
    const hoy = new Date().toISOString().slice(0,10);
    jornadaProg = (D.jornadas.find(j => j.fecha >= hoy) || D.jornadas[D.jornadas.length-1]).id;
  }

  const chips = D.jornadas.map(j =>
    `<button class="chip ${jornadaProg===j.id?'on':''}" data-jor="${j.id}">${esc(j.nombre)}</button>`).join('');

  const jor = D.jornadas.find(x => x.id === jornadaProg);
  const lista = D.partidos.filter(p => p.jornada_id === jornadaProg)
    .sort((a,b) => (a.hora||'99').localeCompare(b.hora||'99')
                || String(a.cancha||'').localeCompare(String(b.cancha||'')));

  const cuerpo = lista.length
    ? parrilla(lista)
    : `<div class="vacio">Esta fecha todavía no tiene programación.<br>Las administradoras la publican durante la semana.</div>`;

  return `<h2 class="sec">Programación</h2>
    <div class="chips">${chips}</div>
    ${resumenFecha(jor, lista)}
    ${cuerpo}`;
}

/* El encabezado de la fecha elegida. Lo ve todo el mundo, incluso
   quien entró solo a mirar: cuánto falta, cuántos partidos hay y
   entre qué horas. A la jugadora conectada le agrega su hora. */
function resumenFecha(jor, lista){
  if(!lista.length)
    return `<p class="nota">${esc(jor.nombre)} · ${esc(fechaLarga(jor.fecha))}</p>`;

  const horas = [...new Set(lista.map(p => p.hora ? p.hora.slice(0,5) : null).filter(Boolean))].sort();
  const canchas = new Set(lista.map(p => p.cancha).filter(Boolean)).size;
  const cats = D.categorias.filter(c => lista.some(p => p.categoria_id === c.id)).map(c => c.codigo);
  const falta = cuantoFalta(new Date(jor.fecha + 'T' + (horas[0] || '12:00') + ':00').getTime());

  const pendientes = lista.filter(x => x.estado === 'pendiente').length;
  const mios = lista.filter(esMio).sort((a,b) => (a.hora||'').localeCompare(b.hora||''));
  const mio = mios.length
    ? `<p class="tuyo">${mios.map(p =>
        `Juegas a las <b>${esc(p.hora ? p.hora.slice(0,5) : 'por confirmar')}</b>${
          p.cancha ? ` en la cancha <b>${esc(p.cancha)}</b>` : ''}`).join('. ')}.</p>`
    : '';

  return `<div class="resumen">
    <span class="cuenta">${esc(falta)}</span>
    <p class="cuando">${esc(mayus(fechaLarga(jor.fecha)))}</p>
    <p class="cifra">${lista.length - pendientes} partido${lista.length - pendientes===1?'':'s'}</p>
    ${pendientes ? `<p class="detalle" style="color:var(--lima)">
      + ${pendientes} por reprogramar</p>` : ''}
    <p class="detalle">${horas.length ? esc(horas[0]) + ' a ' + esc(ultimaHora(horas)) : 'horario por confirmar'}${
      canchas ? ` · ${canchas} cancha${canchas===1?'':'s'}` : ''}${
      cats.length ? ` · ${esc(cats.join(' · '))}` : ''}</p>
    ${mio}
  </div>`;
}

/* La última hora de juego, sumándole una hora al último partido. */
function ultimaHora(horas){
  const h = horas[horas.length - 1].split(':');
  return String((+h[0] + 1) % 24).padStart(2,'0') + ':' + h[1];
}

/* La tabla de posiciones la calcula la base de datos. Si por lo
   que sea no llega (falta correr un SQL, o un permiso), la sacamos
   acá con las mismas reglas, para no mostrar todo en blanco. */
function tablaEquipos(){
  if(D.tabla.length) return D.tabla;
  const base = D.equipos.map(e => ({
    equipo_id:e.id, nombre:e.nombre, color:e.color, logo_url:e.logo_url,
    pj:0, pg:0, pp:0, sets_g:0, sets_p:0, dif_sets:0,
    games_g:0, games_p:0, dif_games:0, puntos_extra:0, puntos:0 }));
  const por = {};
  base.forEach(x => { por[x.equipo_id] = x; });

  D.partidos.filter(p => p.estado === 'jugado' && p.set1_a != null).forEach(p => {
    const c = cuentaPartido(p, p.es_final);
    const gA = p.set1_a + p.set2_a, gB = p.set1_b + p.set2_b;
    [[ladoA(p), c.setsA, c.setsB, c.puntosA, gA, gB],
     [ladoB(p), c.setsB, c.setsA, c.puntosB, gB, gA]].forEach(([id, sg, sp, pts, gg, gp]) => {
      const f = por[id];
      if(!f) return;
      f.pj++; if(sg > sp) f.pg++; else f.pp++;
      f.sets_g += sg; f.sets_p += sp; f.games_g += gg; f.games_p += gp; f.puntos += pts;
    });
  });
  D.ajustes.forEach(a => {
    const f = por[a.equipo_id];
    if(f){ f.puntos_extra += a.puntos; f.puntos += a.puntos; }
  });
  base.forEach(f => { f.dif_sets = f.sets_g - f.sets_p; f.dif_games = f.games_g - f.games_p; });
  return base.sort((a, b) => b.puntos - a.puntos
    || b.dif_sets - a.dif_sets || b.dif_games - a.dif_games);
}

/* Lo que el equipo lleva jugado, y lo que le viene. Se mira desde
   el equipo: si ganó o perdió cada partido, y cuántos puntos sacó. */
function partidosDelEquipo(id, ps){
  const jugados = ps.filter(p => p.estado === 'jugado' && p.set1_a != null)
    .sort((a, b) => cuando(b) - cuando(a));
  const vienen = ps.filter(p => p.estado !== 'jugado')
    .sort((a, b) => cuando(a) - cuando(b));
  const t = tablaEquipos().find(x => x.equipo_id === id);

  const resumen = jugados.length ? `<div class="marcha">
      <div><b>${jugados.length}</b><span>jugados</span></div>
      <div><b>${t ? t.pg : 0}</b><span>ganados</span></div>
      <div><b>${t ? t.pp : 0}</b><span>perdidos</span></div>
      <div class="pts-eq"><b>${t ? t.puntos : 0}</b><span>puntos</span></div>
    </div>` : '';

  return `<h2 class="sec">Lo jugado</h2>
    ${resumen}
    ${jugados.length
      ? jugados.map(p => tarjetaEquipo(p, id)).join('')
      : `<div class="vacio">Todavía no juegan ningún partido.<br>
          Acá van a ir apareciendo sus resultados, fecha a fecha.</div>`}
    ${vienen.length ? `<h2 class="sec">Lo que viene</h2>
      ${vienen.map(p => tarjetaEquipo(p, id)).join('')}` : ''}`;
}

/* Un partido visto desde un equipo: primero su dupla, y si ganó. */
function tarjetaEquipo(p, id){
  const mio = ladoA(p) === id;
  const miDupla = mio ? p.dupla_a : p.dupla_b;
  const suDupla = mio ? p.dupla_b : p.dupla_a;
  const suEquipo = mio ? ladoB(p) : ladoA(p);
  const j = D.jornadas.find(x => x.id === p.jornada_id);
  const jugado = p.estado === 'jugado' && p.set1_a != null;
  let gano = null;
  if(jugado){
    const c = cuentaPartido(p, p.es_final);
    gano = mio ? c.setsA > c.setsB : c.setsB > c.setsA;
  }
  return `<div class="card">
    <div class="fila" style="margin:0">
      <span class="cat">${esc(cat(p.categoria_id))}</span>
      <span style="font-size:12px;color:var(--gris)">${j ? esc(j.nombre) : ''}</span>
      ${jugado
        ? `<span class="veredicto-chip ${gano ? 'gano' : 'perdio'}">${gano ? 'Ganado' : 'Perdido'}</span>`
        : `<span class="mono" style="font-size:12px;color:var(--gris)">${
            p.hora ? esc(p.hora.slice(0,5)) : ''}${p.cancha ? ' · cancha ' + esc(p.cancha) : ''}</span>`}
      ${jugado ? `<span class="mono" style="margin-left:auto;font-weight:700">${esc(marcadorTexto(p))}</span>` : ''}
    </div>
    <div style="margin-top:9px;font-size:14px;line-height:1.45">
      <strong>${esc(nomDupla(miDupla))}</strong>
      <span style="color:var(--gris)"> contra </span>
      <strong>${esc(nomDupla(suDupla))}</strong>
      <span style="color:var(--gris)"> · ${esc(eq(suEquipo))}</span>
    </div>
  </div>`;
}

/* Cuándo se juega un partido, como número, para poder ordenarlos. */
function cuando(p){
  const j = D.jornadas.find(x => x.id === p.jornada_id);
  if(!j) return Infinity;
  return new Date(j.fecha + 'T' + (p.hora ? p.hora.slice(0,5) : '00:00') + ':00').getTime();
}

/* Primera letra en mayúscula, el resto como viene. */
const mayus = t => String(t ?? '').charAt(0).toUpperCase() + String(t ?? '').slice(1);

/* Cuántos días faltan, en palabras. */
function cuantoFalta(ms){
  const dias = Math.ceil((ms - Date.now()) / 86400000);
  if(dias < 0)  return 'ya pasó';
  if(dias === 0) return '¡es hoy!';
  if(dias === 1) return 'es mañana';
  if(dias < 14) return `faltan ${dias} días`;
  return `faltan ${Math.round(dias / 7)} semanas`;
}

/* La frase de ánimo cambia según la categoría, para que no sea
   siempre la misma cuando la jugadora juega dos partidos. */
const ARENGAS = [
  'A dejarlo todo en la cancha.',
  'Que tiemble la red.',
  'Sonríe, que te están mirando.',
  'Paciencia en el fondo y veneno en la volea.',
  'La pared es tu amiga.',
  'A ganar con estilo.',
  'Tu dupla cuenta contigo.'
];

/* La tarjeta grande del próximo partido. Es lo primero que ve la
   jugadora al entrar a Mis partidos. */
function proximoPartido(p, ids){
  const j = D.jornadas.find(x => x.id === p.jornada_id);
  const miLadoA = ids.includes(p.dupla_a);
  const miDupla = miLadoA ? p.dupla_a : p.dupla_b;
  const rival   = miLadoA ? p.dupla_b : p.dupla_a;
  const rivalEq = miLadoA ? ladoB(p) : ladoA(p);
  /* En la dupla A/B la jugadora prestada juega para el equipo de su
     partner A, así que acá va el equipo de la dupla, no el suyo. */
  const miEq    = miLadoA ? ladoA(p) : ladoB(p);
  const compa = (() => {
    const d = D.duplas.find(x => x.id === miDupla);
    if(!d) return null;
    return [d.jugadora_1, d.jugadora_2].filter(i => i !== yo.jugadora_id)
      .map(i => D.jugadoras.find(x => x.id === i)?.nombre).filter(Boolean)[0];
  })();
  const falta = cuantoFalta(cuando(p));
  const arenga = ARENGAS[(p.id + p.categoria_id) % ARENGAS.length];

  return `<div class="proximo">
    <span class="cuenta">${esc(falta)}</span>
    <p class="cuando">${j ? esc(mayus(fechaLarga(j.fecha))) : ''}</p>
    <p class="hora-grande">${p.hora ? esc(p.hora.slice(0,5)) : 'hora por confirmar'}${
      p.cancha ? ` <span>· cancha ${esc(p.cancha)}</span>` : ''}</p>
    <div class="contra">
      <div class="contra-lado">
        <span class="rot">Categoría ${esc(cat(p.categoria_id))}</span>
        <strong>Tú y ${esc(compa || 'tu dupla')}</strong>
        <span class="eqn"><span class="punto" style="background:${esc(colorEq(miEq))}"></span>${esc(eq(miEq))}${
          miEq !== yo.equipo_id ? ' · juegas prestada' : ''}</span>
      </div>
      <span class="contra-vs">vs</span>
      <div class="contra-lado der">
        <span class="rot">Al frente</span>
        <strong>${esc(nomDupla(rival))}</strong>
        <span class="eqn"><span class="punto" style="background:${esc(colorEq(rivalEq))}"></span>${esc(eq(rivalEq))}</span>
      </div>
    </div>
    <p class="arenga">${esc(arenga)}</p>
  </div>`;
}

/* Los partidos siguientes, en chico. */
function miniPartido(p, ids){
  const j = D.jornadas.find(x => x.id === p.jornada_id);
  const miLadoA = ids.includes(p.dupla_a);
  const rival   = miLadoA ? p.dupla_b : p.dupla_a;
  const rivalEq = miLadoA ? ladoB(p) : ladoA(p);

        p.hora ? esc(p.hora.slice(0,5)) : '—'}${p.cancha ? ' · cancha ' + esc(p.cancha) : ''}</span></div>

/* --- auspiciadores --- */
/* Los logos vienen dentro de la base de datos y pesan. No tiene
   sentido bajarlos cada vez que alguien abre la app: se traen la
   primera vez que se entra a esta pantalla. */
let bajandoAuspicios = false;
async function cargarAuspicios(forzar){
  if(bajandoAuspicios || (D.auspiciadores !== null && !forzar)) return;
  bajandoAuspicios = true;
  try{
    D.auspiciadores = (await sb.from('auspiciadores').select('*').order('orden')).data ?? [];
  }catch(e){ D.auspiciadores = []; }
  bajandoAuspicios = false;
  pintar();
}

/* Acepta un @usuario de Instagram y lo convierte en dirección.
   Si ya viene una dirección completa, la deja igual. */
function comoEnlace(t){
  const v = String(t ?? '').trim();
  if(!v) return null;
  if(/^@/.test(v)) return 'https://instagram.com/' + v.slice(1).replace(/\/+$/,'');
  if(/^https?:\/\//i.test(v)) return v;
  if(/^(instagram\.com|www\.instagram\.com)\//i.test(v)) return 'https://' + v;
  if(/^[\w.]+$/.test(v) && !v.includes('.')) return 'https://instagram.com/' + v;
  return 'https://' + v;
}

function vAuspiciadores(){
  if(D.auspiciadores === null){ cargarAuspicios(); return `<h2 class="sec">Auspiciadores</h2>
    <div class="vacio">Cargando…</div>`; }
  if(!D.auspiciadores.length)
    return `<h2 class="sec">Auspiciadores</h2>

  return `<h2 class="sec">Auspiciadores</h2>
    <p class="nota">Sin ellas y ellos no habría torneo. Si pueden, devuélvanles la mano.</p>
    <div class="auspicios">${D.auspiciadores.map(a => {

        ${a.mensaje ? `<span>${esc(a.mensaje)}</span>` : ''}`;
      return a.enlace

          ? `<img class="diva-foto" src="${esc(d.foto_url)}" alt="${esc(nombre)}"
               style="object-position:center ${d.foto_pos ?? 50}%">`
          : `<div class="diva-sinfoto" aria-hidden="true">${esc(nombre.charAt(0).toUpperCase())}</div>`}
        ${d.logo_url
          ? `<span class="diva-emblema" aria-hidden="true"><img src="${esc(d.logo_url)}" alt=""></span>`
          : ''}
      </div>
      <h3>${esc(nombre)}</h3>
      <p class="diva-sigla">DIVA</p>
      <p class="diva-largo">Decisora Imparcial de Validación y Arbitraje</p>
      ${d.descripcion ? `<p class="texto">${esc(d.descripcion)}</p>` : ''}
    </div>`;

  const regla = d.reglamento_url
    ? `<a class="reglamento" href="${esc(d.reglamento_url)}" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5z"/>
          <path d="M14 3v5h5M9 13h6M9 17h4"/></svg>
        <span style="flex:1"><strong>Reglamento del torneo</strong>
        <span>Las bases oficiales, en PDF</span></span></a>`
    : `<div class="vacio" style="margin-bottom:12px">El reglamento todavía no está subido.</div>`;

  const formulario = yo
    ? `<div class="card">
        <h3>Hacerle una pregunta</h3>
        <p style="font-size:13px;color:var(--gris);margin:0 0 10px">
          Tu pregunta y la respuesta quedan visibles para todas, como respaldo oficial.</p>
        <div id="q-msg"></div>
        <textarea id="q-texto" maxlength="800"
          placeholder="¿Podemos reprogramar el partido del martes?"></textarea>
        <button class="btn lima" id="q-enviar" style="margin-top:10px">Enviar pregunta</button>
      </div>`
    : `<div class="vacio">Entra con tu nombre para hacerle una pregunta.<br><br>
        <button class="btn lima" id="ir-entrar">Iniciar sesión</button></div>`;

  const lista = D.preguntas.length
    ? D.preguntas.map(q => `<div class="preg">
        <div class="quien"><strong>${esc(q.nombre)}</strong>
          <time>${esc(fechaCorta(q.creada_en))}</time></div>
        <p class="texto">${esc(q.texto)}</p>
        ${q.respuesta
          ? `<div class="resp"><p class="de">Responde ${esc(nombre)}</p>
             <p>${esc(q.respuesta)}</p></div>`
          : `<p class="sin-resp">Esperando respuesta.</p>`}
        ${sesion ? `<div class="fila" style="margin:11px 0 0">
          <button class="btn claro q-responder" data-id="${q.id}">
            ${q.respuesta ? 'Editar respuesta' : 'Responder'}</button>
          <button class="btn claro q-borrar" data-id="${q.id}"
            style="border-color:var(--alerta);color:var(--alerta)">Borrar</button>
        </div>
        ${respondiendo === q.id ? `<div style="margin-top:10px">
          <textarea class="q-resp-texto" maxlength="1500">${esc(q.respuesta ?? '')}</textarea>
          <div class="fila" style="margin-top:9px">
            <button class="btn lima q-guardar" data-id="${q.id}">Guardar respuesta</button>
            <button class="btn claro q-cancelar">Cancelar</button></div>
          <div class="q-resp-msg"></div></div>` : ''}` : ''}
      </div>`).join('')
    : `<div class="vacio">Todavía no hay preguntas.</div>`;

  return `<h2 class="sec">DIVA</h2>
    ${ficha}
    ${regla}
    ${sesion ? panelDiva() : ''}
    <h2 class="sec">Preguntas${sinResponder ? ` · ${sinResponder} sin responder` : ''}</h2>
    ${formulario}
    ${lista}`;
}

/* Lo que solo ve la DIVA: su ficha y el reglamento */
let editandoDiva = false;
function panelDiva(){
  const d = D.diva || {};
  if(!editandoDiva) return `<div class="card">
      <div class="fila" style="margin:0">
        <span style="flex:1;font-size:13.5px;color:var(--gris)">
          ${soyDiva ? 'Eres la DIVA.' : 'Como administradora'} puedes editar la ficha,
          subir el reglamento y responder las preguntas.</span>
        <button class="btn claro" id="dv-editar">Editar la ficha</button>
      </div></div>`;
  return `<div class="card">
      <h3>Ficha de la DIVA</h3>
      <div style="margin-bottom:10px"><label class="lab">Nombre</label>
        <input type="text" id="dv-nom" value="${esc(d.nombre ?? '')}"></div>
      <div style="margin-bottom:10px"><label class="lab">Descripción</label>
        <textarea id="dv-desc" maxlength="1500">${esc(d.descripcion ?? '')}</textarea></div>
      <div style="margin-bottom:10px"><label class="lab">Logo de la DIVA</label>
        <input type="file" id="dv-logo" accept="image/*"></div>
      <div style="margin-bottom:10px"><label class="lab">Su foto</label>
        <input type="file" id="dv-foto" accept="image/*">
        ${d.foto_url ? `<div class="encuadre">
          <img id="dv-previa" src="${esc(d.foto_url)}"
            style="object-position:center ${d.foto_pos ?? 50}%" alt="">
          <div style="flex:1">
            <label class="lab">Subir o bajar el encuadre</label>
            <input type="range" id="dv-pos" min="0" max="100" value="${d.foto_pos ?? 50}">
          </div></div>` : ''}</div>
      <div style="margin-bottom:12px"><label class="lab">Reglamento en PDF</label>
        <input type="file" id="dv-pdf" accept="application/pdf">
        ${d.reglamento_url ? '<p style="font-size:11.5px;color:var(--gris);margin:5px 0 0">Ya hay uno subido. Sube otro solo si lo quieres reemplazar.</p>' : ''}</div>
      <div class="fila"><button class="btn lima" id="dv-guardar">Guardar</button>
        <button class="btn claro" id="dv-cancelar">Cancelar</button></div>
      <div id="dv-msg"></div>
    </div>`;
}

/* --- noticias: portada, lista y nota completa --- */
const clase = e => norm(e).replace('ó','o').replace(/[^a-z]/g,'');
const fechaCorta = f => f
  ? new Date(f).toLocaleDateString('es-CL',{day:'numeric',month:'short'}) +
    ' · ' + new Date(f).toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'})
  : '';
let respondiendo = null;
const fechita = n => {
  const f = n.publicada_en || n.creada_en;
  return f ? new Date(f).toLocaleDateString('es-CL',{day:'numeric',month:'long'}) : '';
};

let subNot = 'noticias';
function vNoticias(){
  const pub = D.noticias.filter(n => n.publicada || sesion);
  if(noticiaAbierta){
    const n = D.noticias.find(x => x.id === noticiaAbierta);
    if(n) return `<h2 class="sec">Noticias</h2>
      <button class="btn claro" id="volver-n" style="margin-bottom:14px">← Todas las noticias</button>
      <div class="card detalle">
        ${n.portada_url ? `<img class="hero" src="${esc(n.portada_url)}" alt="">` : ''}
        <span class="etq ${clase(n.etiqueta||'Crónica')}">${esc(n.etiqueta || 'Crónica')}</span>
        <h3>${esc(n.titulo)}</h3>
        ${n.bajada ? `<p class="baj">${esc(n.bajada)}</p>` : ''}
        <div class="txt">${esc(n.cuerpo || '')}</div>
        <p class="fechita" style="margin-top:16px">${esc(fechita(n))}</p>
        ${!n.publicada ? '<div class="borrador">Borrador · no visible para el público</div>' : ''}
      </div>`;
  }

  const chips = `<div class="chips">
    <button class="chip ${subNot==='noticias'?'on':''}" data-not="noticias">Noticias</button>
    <button class="chip ${subNot==='gritos'?'on':''}" data-not="gritos">Los gritos</button></div>`;

  if(subNot === 'gritos'){
    const con = D.equipos.filter(e => (e.grito || '').trim());
    return `<h2 class="sec">Noticias</h2>${chips}` + (con.length
      ? con.map(e => `<div class="card grito">
          <div class="fila" style="margin:0 0 8px">
            ${e.logo_url ? `<img src="${esc(e.logo_url)}" style="width:34px;height:34px;object-fit:contain;border-radius:7px">` : ''}
            <strong>${esc(e.nombre)}</strong></div>
          <p class="frase">“${esc(e.grito)}”</p></div>`).join('')
      : `<div class="vacio">Todavía no hay gritos cargados.<br>Se agregan desde Administración, en Equipos.</div>`);
  }

  if(!pub.length)
    return `<h2 class="sec">Noticias</h2>${chips}<div class="vacio">Todavía no hay noticias publicadas.<br>Acá van a aparecer las crónicas de cada fecha.</div>`;

  const dest = pub.find(n => n.destacada) || pub[0];
  const resto = pub.filter(n => n.id !== dest.id);

  return `<h2 class="sec">Noticias</h2>${chips}
    <div class="portada" data-noticia="${dest.id}">
      <div class="foto">
        ${dest.portada_url ? `<img src="${esc(dest.portada_url)}" alt="">` : ''}
        <div class="velo2"></div>
        <div class="sobre">
          <span class="etq ${clase(dest.etiqueta||'Crónica')}">${esc(dest.etiqueta || 'Crónica')}</span>
          <h3>${esc(dest.titulo)}</h3>
        </div>
      </div>
      <div class="cuerpo">
        ${dest.bajada ? `<p class="baj">${esc(dest.bajada)}</p>` : ''}
        <p class="fechita" style="margin-top:8px">${esc(fechita(dest))}${dest.publicada?'':' · borrador'}</p>
      </div>
    </div>
    ${resto.length ? `<h2 class="sec">Más noticias</h2>` : ''}
    ${resto.map(n => `<div class="nota-mini" data-noticia="${n.id}">
        ${n.portada_url ? `<img class="th" src="${esc(n.portada_url)}" alt="">` : '<div class="th"></div>'}
        <div class="tx">
          <span class="etq ${clase(n.etiqueta||'Crónica')}">${esc(n.etiqueta || 'Crónica')}</span>
          <h4>${esc(n.titulo)}</h4>
          <p class="fechita">${esc(fechita(n))}${n.publicada?'':' · borrador'}</p>
        </div>
      </div>`).join('')}`;
}

function pintarNombres(){
  const cont = $('#j-lista'); if(!cont) return;
  const q = norm($('#j-buscar').value);

  if(!q){ cont.innerHTML = ''; return; }          /* nada hasta que escriba */
  if(!D.jugadoras.length){
    cont.innerHTML = '<p class="sinres">Todavía no hay jugadoras cargadas.</p>'; return;
  }

  const lista = D.jugadoras.filter(j => norm(j.nombre).includes(q)).slice(0, 12);
  cont.innerHTML = lista.length
    ? lista.map(j => `<button class="nombre" data-jug="${j.id}">
        ${inicial(j.nombre, j.equipo_id, 'avatar chico')}
        <div><strong>${esc(j.nombre)}</strong><span>${esc(eq(j.equipo_id))}</span></div>
      </button>`).join('')
    : '<p class="sinres">Ningún nombre calza con eso. Pregúntale a tu capitana cómo quedaste inscrita.</p>';
  cont.querySelectorAll('.nombre').forEach(b => b.onclick = () => entrarComo(+b.dataset.jug));
}

function entrarComo(id){
  const j = D.jugadoras.find(x => x.id === id);
  if(!j) return;
  const d = D.duplas.find(x => x.jugadora_1 === j.id || x.jugadora_2 === j.id);
  yo = { jugadora_id:j.id, nombre:j.nombre, equipo_id:j.equipo_id, dupla_id:d?.id ?? null };
  localStorage.setItem('batalla:jugadora', JSON.stringify(yo));
  pintarMenu(); vista = 'perfil'; subPerfil = 'partidos'; pintar();
}

/* --- administración --- */
function vAdmin(){
  if(!sesion) return `<h2 class="sec">Administración</h2>
    <div class="vacio">Tu sesión de administradora no está activa.<br><br>
      <button class="btn lima" id="ir-entrar">Iniciar sesión</button></div>`;
  const chips = ['equipos','plantel','programacion','noticias','auspicio','extra'].map(s =>
    `<button class="chip ${subAdm===s?'on':''}" data-adm="${s}">${
      {equipos:'Equipos',plantel:'Jugadoras y duplas',programacion:'Programación',
       noticias:'Noticias',auspicio:'Auspiciadores',extra:'Puntos extra'}[s]}</button>`).join('');
  return `<h2 class="sec">Administración</h2><div class="chips">${chips}</div>` +
    ({ equipos:admEquipos, plantel:admPlantel, programacion:admProgramacion,
       noticias:admNoticias, auspicio:admAuspicio, extra:admExtra }[subAdm])();
}

function admEquipos(){

    D.equipos.map(e => `<div class="card" data-eqedit="${e.id}">
      <div class="fila" style="margin-bottom:14px">
        <span class="muestra" style="background:${esc(e.color || '#CBDDD9')}"></span>
        ${e.logo_url
          ? `<img src="${esc(e.logo_url)}" style="width:46px;height:46px;object-fit:contain;
              background:#fff;border:1px solid var(--linea);border-radius:9px;padding:3px">`
          : `<span class="sin-logo">sin logo</span>`}
        ${e.foto_url
          ? `<img src="${esc(e.foto_url)}" style="width:62px;height:46px;object-fit:cover;border-radius:6px">`
          : `<span class="sin-logo">sin foto</span>`}
        <span style="font-size:12px;color:var(--gris);margin-left:auto">Equipo ${e.orden}</span>
      </div>
      <div style="margin-bottom:10px"><label class="lab">Nombre del equipo</label>
        <input type="text" class="e-nom" value="${esc(e.nombre)}" placeholder="Las Pitufas"></div>
      <div style="margin-bottom:10px"><label class="lab">Logo</label>
        <input type="file" class="e-logo" accept="image/*">
        <p style="font-size:11.5px;color:var(--gris);margin:5px 0 0">
          Va en el círculo de cada jugadora del equipo. Mejor cuadrado y con fondo transparente.</p></div>
      <div style="margin-bottom:10px"><label class="lab">Foto del equipo</label>
        <input type="file" class="e-foto" accept="image/*">
        <p style="font-size:11.5px;color:var(--gris);margin:5px 0 0">
          La de las nueve juntas. Se ve en la lista de equipos y sobre la descripción.</p></div>
      <div style="margin-bottom:10px"><label class="lab">Color</label>
        <div class="fila" style="margin:0">
          <input type="color" class="e-col" value="${esc(e.color || '#007E76')}" style="width:54px;padding:3px">
          <span style="font-size:12px;color:var(--gris)">Marca al equipo en las listas y en los círculos.</span>
        </div></div>
      <div style="margin-bottom:10px"><label class="lab">Capitana</label>
        <input type="text" class="e-cap" value="${esc(e.capitana ?? '')}" placeholder="Nombre de la capitana">
        <p style="font-size:11.5px;color:var(--gris);margin:5px 0 0">
          Aparece arriba de la descripción al abrir el equipo.</p></div>
      <div style="margin-bottom:10px"><label class="lab">Foto de la capitana</label>
        <input type="file" class="e-capfoto" accept="image/*"></div>
      <div style="margin-bottom:10px"><label class="lab">Descripción</label>
        <textarea class="e-desc" maxlength="1000">${esc(e.descripcion ?? '')}</textarea></div>
      <div style="margin-bottom:12px"><label class="lab">Grito</label>
        <input type="text" class="e-grito" value="${esc(e.grito ?? '')}"></div>
      <button class="btn e-guardar">Guardar</button>
      <div class="e-msg"></div>
    </div>`).join('');
}

function admPlantel(){
  const sel = D.equipos.map(e => `<option value="${e.id}" ${equipoAbierto===e.id?'selected':''}>${esc(e.nombre)}</option>`).join('');
  const id = equipoAbierto ?? D.equipos[0]?.id;
  if(!id) return `<div class="vacio">Primero tienen que existir los equipos.</div>`;
  const filas = D.categorias.map(c => {
    const d = D.duplas.find(x => x.equipo_id === id && x.categoria_id === c.id);
    const j = [0,1].map(k => D.jugadoras.find(x => x.id === (k ? d?.jugadora_2 : d?.jugadora_1)));
    const eqs2 = D.equipos.filter(e => e.id !== id)
      .map(e => `<option value="${e.id}" ${d?.equipo_2_id===e.id?'selected':''}>${esc(e.nombre)}</option>`).join('');
    return `<div class="card" data-dupla="${c.id}">
      <div class="fila" style="margin-bottom:12px"><span class="cat">${esc(c.codigo)}</span>
        ${d?.foto_url ? `<img src="${esc(d.foto_url)}" style="width:44px;height:44px;border-radius:8px;object-fit:cover">` : ''}</div>
      ${[0,1].map(k => `<div class="fila">
        <div style="flex:1;min-width:120px"><label class="lab">Jugadora ${k+1}</label>
          <input type="text" class="p-nom" data-k="${k}" value="${esc(j[k]?.nombre ?? '')}"></div>
      </div>`).join('')}
      <div style="margin:2px 0 10px"><label class="lab">Dupla mixta · segundo equipo</label>
        <select class="d-eq2"><option value="">No es mixta</option>${eqs2}</select>
        <p style="font-size:11.5px;color:var(--gris);margin:5px 0 0">
          Solo para categoría A/B: de qué equipo viene la partner prestada.
          Los puntos igual van completos al equipo de la jugadora A.</p></div>
      <div style="margin:6px 0 10px"><label class="lab">Descripción de la dupla</label>
        <textarea class="d-desc" maxlength="1000">${esc(d?.descripcion ?? '')}</textarea>
        <p style="font-size:11.5px;color:var(--gris);margin:5px 0 0">
          Se ve en Equipos, tocando la dupla, y en el perfil de ellas dos. Máximo 1000 caracteres.</p></div>
      <div style="margin-bottom:10px"><label class="lab">Foto de la dupla</label>
        <input type="file" class="d-foto" accept="image/*"></div>
      <button class="btn d-guardar">Guardar dupla</button>
      <div class="d-msg"></div>
    </div>`;
  }).join('');
  return `<div style="margin-bottom:12px"><label class="lab" style="color:#fff">Equipo</label>
      <select id="adm-eq">${sel}</select></div>
    <p class="nota">El nombre que escribas acá es con el que cada jugadora va a entrar a la app, así que tiene que ser único. Si hay dos Javis, distínguelas.</p>${filas}`;

/* Mueve un auspiciador una posición, intercambiando el orden con su
   vecino. Más simple que renumerar la lista entera. */
async function moverAuspicio(id, paso){
  const i = D.auspiciadores.findIndex(a => a.id === id);
  const otro = D.auspiciadores[i + paso];
  if(i < 0 || !otro) return;
  const a = D.auspiciadores[i];
  await sb.from('auspiciadores').update({ orden: otro.orden }).eq('id', a.id);
  await sb.from('auspiciadores').update({ orden: a.orden }).eq('id', otro.id);
  /* Si quedaron con el mismo número, se renumera todo de una vez. */
  if(a.orden === otro.orden){
    const lista = [...D.auspiciadores];
    lista.splice(i, 1); lista.splice(i + paso, 0, a);
    for(let k = 0; k < lista.length; k++)
      await sb.from('auspiciadores').update({ orden: k + 1 }).eq('id', lista[k].id);
  }
  await cargarAuspicios(true);
}

/* ============================================================
   CARGAR EL RESULTADO DE UN PARTIDO
   Dos sets a 6 juegos (tie break a 7 si van 6-6) y, si quedan
   1-1, súper tie break a 11 por diferencia de 2.
   ============================================================ */

/* El marcador escrito, para mostrarlo en las listas. */
function marcadorTexto(p){
  if(p.set1_a == null) return '';
  let t = `${p.set1_a}-${p.set1_b} · ${p.set2_a}-${p.set2_b}`;
  if(p.stb_a != null) t += ` · [${p.stb_a}-${p.stb_b}]`;
  return t;
}

/* Las mismas cuentas que hace la base de datos, para poder
   mostrar quién gana y cuántos puntos antes de guardar. */
function cuentaPartido(m, esFinal){
  const gan = (a,b) => a != null && b != null && a > b;
  const setsA = (gan(m.set1_a,m.set1_b)?1:0) + (gan(m.set2_a,m.set2_b)?1:0) + (gan(m.stb_a,m.stb_b)?1:0);
  const setsB = (gan(m.set1_b,m.set1_a)?1:0) + (gan(m.set2_b,m.set2_a)?1:0) + (gan(m.stb_b,m.stb_a)?1:0);
  const pts = (propios, ajenos) => esFinal
    ? (propios > ajenos ? 60 : 30)
    : propios > ajenos ? (ajenos === 0 ? 40 : 30)
                       : (propios === 0 ? 10 : 20);
  return { setsA, setsB, puntosA: pts(setsA, setsB), puntosB: pts(setsB, setsA) };
}

/* Avisos de un marcador raro. No impiden guardar: en la cancha
   pasa de todo y la DIVA manda. */
function reparos(m){
  const r = [];
  const revisa = (a, b, n) => {
    if(a == null || b == null) return r.push(`Falta el set ${n}.`);
    if(a === b) return r.push(`El set ${n} no puede quedar empatado.`);
    const alto = Math.max(a,b), bajo = Math.min(a,b);
    if(alto > 7) r.push(`El set ${n} tiene más de 7 juegos.`);
    else if(alto === 7 && bajo < 5) r.push(`Un 7-${bajo} en el set ${n} no es un resultado normal.`);
    else if(alto < 6) r.push(`El set ${n} terminó antes de los 6 juegos.`);
  };
  revisa(m.set1_a, m.set1_b, 1);
  revisa(m.set2_a, m.set2_b, 2);
  if(m.stb_a != null || m.stb_b != null){
    if(m.stb_a == null || m.stb_b == null) r.push('Falta un número del súper tie break.');
    else if(m.stb_a === m.stb_b) r.push('El súper tie break no puede quedar empatado.');
    else if(Math.max(m.stb_a,m.stb_b) < 11) r.push('El súper tie break se juega a 11.');
    else if(Math.abs(m.stb_a - m.stb_b) < 2) r.push('El súper tie break se gana por diferencia de 2.');
  }
  return r;
}
